<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LifeFlow — Your Personal OS</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { margin: 0; padding: 0; }
    #root { min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    const uid = () => Math.random().toString(36).slice(2, 9);
    const today = () => new Date().toISOString().slice(0, 10);
    const fmt = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric" });
    const fmtFull = (d) => new Date(d + "T00:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric" });
    const daysInMonth = (y, m) => new Date(y, m + 1, 0).getDate();
    const firstDayOfMonth = (y, m) => new Date(y, m, 1).getDay();

    const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
    const DAYS_SHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

    const QUOTES = [
      { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
      { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
      { text: "Small daily improvements are the key to staggering long-term results.", author: "Robin Sharma" },
      { text: "You are never too old to set another goal or to dream a new dream.", author: "C.S. Lewis" },
      { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
      { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
      { text: "Success is the sum of small efforts, repeated day in and day out.", author: "Robert Collier" },
    ];

    const PROMPTS = [
      "What made you smile today?",
      "What challenge did you overcome today?",
      "What are you grateful for today?",
      "What is one thing you want to improve tomorrow?",
      "Describe a moment of peace you experienced today.",
      "What did you learn about yourself today?",
      "Who inspired you today, and why?",
      "What would you do differently if you could replay today?",
    ];

    const MOODS = [
      { label: "Very Happy", icon: "😄", value: 5, color: "#22c55e" },
      { label: "Happy",      icon: "🙂", value: 4, color: "#84cc16" },
      { label: "Neutral",    icon: "😐", value: 3, color: "#f59e0b" },
      { label: "Sad",        icon: "😔", value: 2, color: "#f97316" },
      { label: "Very Sad",   icon: "😢", value: 1, color: "#ef4444" },
    ];

    const CATEGORIES = ["Personal", "Work", "Health", "Learning", "Fitness", "Finance", "Social", "Other"];
    const PRIORITIES  = ["Low", "Medium", "High"];
    const STATUSES    = ["To Do", "In Progress", "Completed"];

    const seedTasks = [
      { id: uid(), title: "Morning workout", desc: "30-min cardio session", due: today(), priority: "High", category: "Fitness", status: "Completed" },
      { id: uid(), title: "Read 20 pages", desc: "Continue current book", due: today(), priority: "Medium", category: "Learning", status: "In Progress" },
      { id: uid(), title: "Weekly review", desc: "Review goals and plan next week", due: today(), priority: "High", category: "Personal", status: "To Do" },
    ];
    const seedHabits = [
      { id: uid(), name: "Morning meditation", emoji: "🧘", color: "#8b5cf6", completions: {} },
      { id: uid(), name: "Drink 8 glasses of water", emoji: "💧", color: "#3b82f6", completions: {} },
      { id: uid(), name: "Read for 20 minutes", emoji: "📚", color: "#10b981", completions: {} },
      { id: uid(), name: "Exercise", emoji: "🏃", color: "#f59e0b", completions: {} },
    ];
    const seedEvents = [
      { id: uid(), title: "Team standup", desc: "Daily sync", date: today(), time: "09:00", status: "Confirmed" },
      { id: uid(), title: "Dentist appointment", desc: "Annual checkup", date: today(), time: "14:30", status: "Confirmed" },
    ];

    function useLS(key, init) {
      const [val, setVal] = useState(() => {
        try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : init; }
        catch { return init; }
      });
      useEffect(() => { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }, [key, val]);
      return [val, setVal];
    }

    const lightCSS = {
      app:      { background: "#f8f7ff", color: "#1a1a2e" },
      bg:       "#FFE0EE",
      sidebar:  "#ffffff",
      card:     "#ffffff",
      input:    "#FFC7E0",
      text:     "#1a1a2e",
      textMuted:"#6b7280",
      border:   "#e5e7eb",
      hover:    "#f3f4f6",
    };
    const darkCSS = {
      app:      { background: "#0f0f1a", color: "#e2e8f0" },
      bg:       "#0f0f1a",
      sidebar:  "#16162a",
      card:     "#1a1a2e",
      input:    "#0f0f1a",
      text:     "#e2e8f0",
      textMuted:"#94a3b8",
      border:   "#2d2d4a",
      hover:    "#252540",
    };

    function SectionHeader({ title, icon, action, onAction, css }) {
      return (
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:12 }}>
          <div style={{ fontWeight:600, color:css.text, fontSize:15 }}>{icon && <span style={{marginRight:6}}>{icon}</span>}{title}</div>
          {action && <button className="lf-btn lf-btn-ghost" style={{ padding:"4px 10px", fontSize:12 }} onClick={onAction}>{action} →</button>}
        </div>
      );
    }

    function EmptyState({ msg, icon, css }) {
      return <div style={{ textAlign:"center", padding:"24px 0", color:css.textMuted, fontSize:14 }}><div style={{fontSize:32, marginBottom:8}}>{icon}</div>{msg}</div>;
    }

    function StatusBadge({ status }) {
      const c = { "To Do":["#f1f5f9","#64748b"], "In Progress":["#fef3c7","#d97706"], "Completed":["#d1fae5","#059669"] };
      const [bg, col] = c[status] || c["To Do"];
      return <span className="tag" style={{ background:bg, color:col }}>{status}</span>;
    }

    function PriorityBadge({ p }) {
      const c = { High:["#fee2e2","#dc2626"], Medium:["#fef3c7","#d97706"], Low:["#d1fae5","#059669"] };
      const [bg, col] = c[p] || c.Low;
      return <span className="tag" style={{ background:bg, color:col }}>{p}</span>;
    }

    function getTimeOfDay() {
      const h = new Date().getHours();
      if (h < 12) return "morning";
      if (h < 17) return "afternoon";
      return "evening";
    }

    function Dashboard({ tasks, habits, events, moods, journals, todayItems, todoItems, wantItems, dailyHistory, quote, css, dark, setTab }) {
      const todayStr = today();
      const todayTasks = tasks.filter(t => t.due === todayStr);
      const todayEvents = events.filter(e => e.date === todayStr);
      const todayMood = moods.find(m => m.date === todayStr);
      const completedToday = todayTasks.filter(t => t.status === "Completed").length;
      const totalTasks = tasks.length;
      const completedTotal = tasks.filter(t => t.status === "Completed").length;
      const habitsDoneToday = habits.filter(h => h.completions[todayStr]).length;

      const getStreak = (habit) => {
        let streak = 0, d = new Date();
        while (true) {
          const k = d.toISOString().slice(0,10);
          if (!habit.completions[k]) break;
          streak++; d.setDate(d.getDate()-1);
        }
        return streak;
      };
      const maxStreak = habits.reduce((max, h) => Math.max(max, getStreak(h)), 0);

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 24 }}>
          <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <div>
              <h1 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 32, fontWeight: 400, color: css.text }}>Good {getTimeOfDay()} ✨</h1>
              <p style={{ color: css.textMuted, marginTop: 4 }}>{fmtFull(todayStr)}</p>
            </div>
            <div style={{ background: dark ? "#1e1b4b" : "#f5f3ff", border: `1px solid ${dark ? "#312e81" : "#ddd6fe"}`, borderRadius: 14, padding: "14px 18px", maxWidth: 340 }}>
              <p style={{ fontSize: 14, fontStyle: "italic", color: dark ? "#c4b5fd" : "#6d28d9", lineHeight: 1.5 }}>"{quote.text}"</p>
              <p style={{ fontSize: 12, color: css.textMuted, marginTop: 6 }}>— {quote.author}</p>
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(150px, 1fr))", gap: 16 }}>
            {[
              { label: "Tasks today", value: `${completedToday}/${todayTasks.length}`, icon: "✅", color: "#8b5cf6" },
              { label: "Habits done", value: `${habitsDoneToday}/${habits.length}`, icon: "🔥", color: "#f59e0b" },
              { label: "Best streak", value: `${maxStreak}d`, icon: "⚡", color: "#ef4444" },
              { label: "Overall progress", value: `${totalTasks ? Math.round(completedTotal/totalTasks*100) : 0}%`, icon: "📈", color: "#10b981" },
            ].map(s => (
              <div key={s.label} className="lf-card" style={{ textAlign: "center" }}>
                <div style={{ fontSize: 28 }}>{s.icon}</div>
                <div style={{ fontSize: 28, fontWeight: 600, color: s.color, marginTop: 4 }}>{s.value}</div>
                <div style={{ fontSize: 12, color: css.textMuted, marginTop: 2 }}>{s.label}</div>
              </div>
            ))}
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 20 }}>
            {/* 1. Today's Tasks (from Tasks page) */}
            <div className="lf-card">
              <SectionHeader title="Today's Tasks" icon="✅" action="View all" onAction={() => setTab("tasks")} css={css} />
              {todayTasks.length === 0 && <EmptyState msg="No tasks due today" icon="😊" css={css} />}
              {todayTasks.slice(0, 4).map(t => (
                <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "10px 0", borderBottom: `1px solid ${css.border}` }}>
                  <div style={{ width: 10, height: 10, borderRadius: 2, background: t.priority === "High" ? "#ef4444" : t.priority === "Medium" ? "#f59e0b" : "#10b981", flexShrink: 0 }} />
                  <span style={{ flex: 1, fontSize: 14, color: css.text, textDecoration: t.status === "Completed" ? "line-through" : "none", opacity: t.status === "Completed" ? 0.5 : 1 }}>{t.title}</span>
                  <StatusBadge status={t.status} />
                </div>
              ))}
            </div>

            {/* 2. To Do Today (from Today page) */}
            {(() => {
              const done = todayItems.filter(i => i.completed).length;
              const total = todayItems.length;
              const pct = total ? Math.round(done / total * 100) : 0;
              const sorted = [...todayItems].sort((a,b) => a.completed - b.completed);
              return (
                <div className="lf-card" style={{ background: dark ? "#1a1a2e" : "#fff", border: `1px solid ${dark ? "#3d2a4a" : "#f3e8ff"}` }}>
                  <SectionHeader title="To Do Today" icon="☀️" action="Open" onAction={() => setTab("today")} css={css} />
                  {total > 0 && (
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 6 }}>
                        <span style={{ fontSize: 12, color: css.textMuted }}>{done} of {total} done</span>
                        <span style={{ fontSize: 12, fontWeight: 600, color: "#ec4899" }}>{pct}%</span>
                      </div>
                      <div className="progress-bar">
                        <div className="progress-fill" style={{ width: `${pct}%`, background: "linear-gradient(90deg, #ec4899, #a855f7)" }} />
                      </div>
                    </div>
                  )}
                  {sorted.length === 0 && <EmptyState msg="Nothing planned yet" icon="☀️" css={css} />}
                  {sorted.slice(0, 5).map(item => (
                    <div key={item.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: `1px solid ${css.border}` }}>
                      <div style={{ width: 18, height: 18, borderRadius: "50%", border: `2px solid ${item.completed ? "#ec4899" : "#d1d5db"}`, background: item.completed ? "#ec4899" : "transparent", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                        {item.completed && <span style={{ color: "#fff", fontSize: 10, lineHeight: 1 }}>✓</span>}
                      </div>
                      <span style={{ flex: 1, fontSize: 13, color: css.text, textDecoration: item.completed ? "line-through" : "none", opacity: item.completed ? 0.5 : 1 }}>{item.text}</span>
                    </div>
                  ))}
                  {total > 5 && <div style={{ fontSize: 11, color: css.textMuted, marginTop: 8, textAlign: "center" }}>+{total - 5} more items</div>}
                </div>
              );
            })()}

            {/* 3. Upcoming Events */}
            <div className="lf-card">
              <SectionHeader title="Upcoming Events" icon="📅" action="View all" onAction={() => setTab("calendar")} css={css} />
              {todayEvents.length === 0 && <EmptyState msg="No events today" icon="📭" css={css} />}
              {todayEvents.slice(0, 4).map(e => (
                <div key={e.id} style={{ display: "flex", gap: 12, padding: "10px 0", borderBottom: `1px solid ${css.border}` }}>
                  <div style={{ background: dark ? "#312e81" : "#f5f3ff", color: "#8b5cf6", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 600, height: "fit-content", flexShrink: 0 }}>{e.time}</div>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 500, color: css.text }}>{e.title}</div>
                    {e.desc && <div style={{ fontSize: 12, color: css.textMuted }}>{e.desc}</div>}
                  </div>
                </div>
              ))}
            </div>

            {/* 4. Habits */}
            <div className="lf-card">
              <SectionHeader title="Today's Habits" icon="🔥" action="View all" onAction={() => setTab("habits")} css={css} />
              {habits.slice(0, 5).map(h => (
                <div key={h.id} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0" }}>
                  <span style={{ fontSize: 20 }}>{h.emoji}</span>
                  <span style={{ flex: 1, fontSize: 14, color: css.text }}>{h.name}</span>
                  <div style={{ width: 24, height: 24, borderRadius: 6, background: h.completions[today()] ? h.color : "transparent", border: `2px solid ${h.color}`, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, color: "#fff" }}>
                    {h.completions[today()] ? "✓" : ""}
                  </div>
                </div>
              ))}
            </div>

            {/* 5. Mood Summary */}
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div className="lf-card">
                <SectionHeader title="Today's mood" icon="💫" action="Log mood" onAction={() => setTab("mood")} css={css} />
                {todayMood ? (
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 8 }}>
                    <span style={{ fontSize: 36 }}>{MOODS.find(m => m.value === todayMood.value)?.icon}</span>
                    <div>
                      <div style={{ fontWeight: 500, color: css.text }}>{MOODS.find(m => m.value === todayMood.value)?.label}</div>
                      {todayMood.note && <div style={{ fontSize: 12, color: css.textMuted }}>{todayMood.note}</div>}
                    </div>
                  </div>
                ) : <EmptyState msg="No mood logged yet" icon="💭" css={css} />}
              </div>
              <div className="lf-card">
                <SectionHeader title="Journal" icon="📝" action="Write" onAction={() => setTab("journal")} css={css} />
                {journals.length > 0 ? (
                  <div style={{ fontSize: 13, color: css.textMuted, marginTop: 8, lineHeight: 1.6 }}>
                    <div style={{ fontSize: 11, marginBottom: 4 }}>{fmt(journals[0].date)}</div>
                    <div style={{ overflow: "hidden", display: "-webkit-box", WebkitLineClamp: 3, WebkitBoxOrient: "vertical" }}>{journals[0].content}</div>
                  </div>
                ) : <EmptyState msg="No journal entries yet" icon="✍️" css={css} />}
              </div>
            </div>

            {/* 6. To Do List widget */}
            {(() => {
              const done  = todoItems.filter(i => i.completed).length;
              const total = todoItems.length;
              const pct   = total ? Math.round(done / total * 100) : 0;
              const pending = [...todoItems].filter(i => !i.completed).sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
              return (
                <div className="lf-card" style={{ border: `1px solid ${dark ? "#1e3a5f" : "#e0f2fe"}` }}>
                  <SectionHeader title="To Do List" icon="📝" action="Open" onAction={() => setTab("todo")} css={css} />
                  <div style={{ display: "flex", gap: 12, marginBottom: 14 }}>
                    {[{l:"Total",v:total,c:"#3b82f6"},{l:"Done",v:done,c:"#10b981"},{l:"Left",v:total-done,c:"#6366f1"}].map(s=>(
                      <div key={s.l} style={{ flex:1, textAlign:"center", background: dark?"#0f2040":"#f0f9ff", borderRadius:10, padding:"8px 4px" }}>
                        <div style={{ fontWeight:700, fontSize:18, color:s.c }}>{s.v}</div>
                        <div style={{ fontSize:10, color:css.textMuted }}>{s.l}</div>
                      </div>
                    ))}
                  </div>
                  {total > 0 && (
                    <div style={{ marginBottom: 12 }}>
                      <div style={{ display:"flex", justifyContent:"space-between", marginBottom:5 }}>
                        <span style={{ fontSize:11, color:css.textMuted }}>Progress</span>
                        <span style={{ fontSize:11, fontWeight:700, color:"#3b82f6" }}>{pct}%</span>
                      </div>
                      <div className="progress-bar">
                        <div className="progress-fill" style={{ width:`${pct}%`, background:"linear-gradient(90deg,#60a5fa,#818cf8)" }} />
                      </div>
                    </div>
                  )}
                  {pending.length === 0 && <EmptyState msg={total===0?"Nothing added yet":"All done! 🎉"} icon={total===0?"📋":"✨"} css={css} />}
                  {pending.slice(0,3).map(item => (
                    <div key={item.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:`1px solid ${css.border}` }}>
                      <div style={{ width:8, height:8, borderRadius:"50%", background:"#60a5fa", flexShrink:0 }} />
                      <span style={{ fontSize:13, color:css.text, flex:1 }}>{item.text}</span>
                    </div>
                  ))}
                  {pending.length > 3 && <div style={{ fontSize:11, color:css.textMuted, marginTop:8, textAlign:"center" }}>+{pending.length-3} more</div>}
                </div>
              );
            })()}

            {/* 7. Want To Do widget */}
            {(() => {
              const done  = wantItems.filter(i => i.completed).length;
              const total = wantItems.length;
              const active = [...wantItems].filter(i => !i.completed).sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt));
              const recent = [...wantItems].sort((a,b) => new Date(b.createdAt)-new Date(a.createdAt)).slice(0,2);
              const CATCOLORS = { Learning:"#f59e0b", Travel:"#06b6d4", Hobby:"#a78bfa", Career:"#3b82f6", "Personal Growth":"#10b981", Fun:"#f97316", Other:"#94a3b8" };
              return (
                <div className="lf-card" style={{ border: `1px solid ${dark ? "#3d1a1a" : "#fce7f3"}` }}>
                  <SectionHeader title="Want To Do" icon="🌟" action="Open" onAction={() => setTab("wantodo")} css={css} />
                  <div style={{ display: "flex", gap: 12, marginBottom: 14 }}>
                    {[{l:"Goals",v:total,c:"#f472b6"},{l:"Achieved",v:done,c:"#fb923c"},{l:"Dreaming",v:total-done,c:"#c084fc"}].map(s=>(
                      <div key={s.l} style={{ flex:1, textAlign:"center", background: dark?"#2d1020":"#fdf2f8", borderRadius:10, padding:"8px 4px" }}>
                        <div style={{ fontWeight:700, fontSize:18, color:s.c }}>{s.v}</div>
                        <div style={{ fontSize:10, color:css.textMuted }}>{s.l}</div>
                      </div>
                    ))}
                  </div>
                  {recent.length > 0 && (
                    <div style={{ marginBottom:10 }}>
                      <div style={{ fontSize:10, fontWeight:700, color:css.textMuted, letterSpacing:"0.05em", textTransform:"uppercase", marginBottom:6 }}>Recently added</div>
                      {recent.map(i => (
                        <div key={i.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"4px 0" }}>
                          <span style={{ fontSize:10, padding:"2px 8px", borderRadius:20, background: dark?"#2d1a2d":(CATCOLORS[i.category]||"#94a3b8")+"20", color: CATCOLORS[i.category]||"#94a3b8", fontWeight:600 }}>{i.category}</span>
                          <span style={{ fontSize:12, color:css.text, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{i.title}</span>
                        </div>
                      ))}
                    </div>
                  )}
                  {active.length === 0 && <EmptyState msg={total===0?"Add your first dream":"All goals achieved! 🌟"} icon={total===0?"💭":"🎊"} css={css} />}
                  {active.slice(0,3).map(item => (
                    <div key={item.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"8px 0", borderBottom:`1px solid ${css.border}` }}>
                      <div style={{ width:8, height:8, borderRadius:"50%", background: CATCOLORS[item.category]||"#f472b6", flexShrink:0 }} />
                      <span style={{ fontSize:13, color:css.text, flex:1, overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{item.title}</span>
                      <span style={{ fontSize:10, color:css.textMuted }}>{item.category}</span>
                    </div>
                  ))}
                  {active.length > 3 && <div style={{ fontSize:11, color:css.textMuted, marginTop:8, textAlign:"center" }}>+{active.length-3} more dreams</div>}
                </div>
              );
            })()}

            {/* 8. Yesterday's Reflection */}
            {(() => {
              const yest = new Date(); yest.setDate(yest.getDate()-1);
              const yestStr = yest.toISOString().slice(0,10);
              const record = dailyHistory.find(h => h.date === yestStr);
              const lavSoft  = dark ? "#1e1b38" : "#faf5ff";
              const lavBorder= dark ? "#4c1d95" : "#e9d5ff";
              const lavText  = dark ? "#c4b5fd" : "#7c3aed";
              return (
                <div className="lf-card" style={{ background: lavSoft, border: `1px solid ${lavBorder}` }}>
                  <SectionHeader title="Yesterday's Reflection" icon="📖" action="View Calendar" onAction={() => setTab("calendar")} css={css} />
                  {!record ? (
                    <EmptyState msg="No history yet — end your day on the Today page to start tracking." icon="🌙" css={css} />
                  ) : (
                    <div>
                      <div style={{ display:"flex", gap:12, marginBottom:14 }}>
                        <div style={{ flex:1, textAlign:"center", background: dark?"#2d1b4a":"#ede9fe", borderRadius:10, padding:"10px 6px" }}>
                          <div style={{ fontWeight:700, fontSize:22, color:lavText }}>{record.completionRate}%</div>
                          <div style={{ fontSize:10, color:css.textMuted, marginTop:2 }}>Completion</div>
                        </div>
                        <div style={{ flex:1, textAlign:"center", background: dark?"#1a2d1a":"#d1fae5", borderRadius:10, padding:"10px 6px" }}>
                          <div style={{ fontWeight:700, fontSize:22, color:"#059669" }}>{record.completedCount}</div>
                          <div style={{ fontSize:10, color:css.textMuted, marginTop:2 }}>Done</div>
                        </div>
                        <div style={{ flex:1, textAlign:"center", background: dark?"#2d2d1a":"#fef3c7", borderRadius:10, padding:"10px 6px" }}>
                          <div style={{ fontWeight:700, fontSize:22, color:"#d97706" }}>{record.totalCount}</div>
                          <div style={{ fontSize:10, color:css.textMuted, marginTop:2 }}>Total</div>
                        </div>
                      </div>
                      <div style={{ fontSize:11, fontWeight:700, color:css.textMuted, textTransform:"uppercase", letterSpacing:"0.05em", marginBottom:8 }}>Completed items</div>
                      {record.items.filter(i=>i.completed).slice(0,3).map(i => (
                        <div key={i.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"6px 0", borderBottom:`1px solid ${css.border}` }}>
                          <span style={{ color:"#ec4899", fontSize:13, flexShrink:0 }}>✓</span>
                          <span style={{ fontSize:13, color:css.text, opacity:0.8 }}>{i.text}</span>
                        </div>
                      ))}
                      {record.items.filter(i=>i.completed).length === 0 && (
                        <div style={{ fontSize:13, color:css.textMuted, textAlign:"center", padding:"8px 0" }}>Nothing completed that day</div>
                      )}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          {/* Daily Activity Insights */}
          {dailyHistory.length > 0 && (() => {
            const now = new Date();
            const weekStart = new Date(now); weekStart.setDate(now.getDate()-6);
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            const inWeek  = dailyHistory.filter(h => h.date >= weekStart.toISOString().slice(0,10));
            const inMonth = dailyHistory.filter(h => h.date >= monthStart.toISOString().slice(0,10));
            const avgRate = dailyHistory.length ? Math.round(dailyHistory.reduce((s,h) => s+h.completionRate,0)/dailyHistory.length) : 0;
            const weekDone = inWeek.reduce((s,h) => s+h.completedCount, 0);
            const monthDone = inMonth.reduce((s,h) => s+h.completedCount, 0);
            // streak
            let streak = 0, d2 = new Date(now);
            d2.setDate(d2.getDate()-1);
            while(true){const k=d2.toISOString().slice(0,10);if(!dailyHistory.find(h=>h.date===k))break;streak++;d2.setDate(d2.getDate()-1);}
            const lavText  = dark ? "#c4b5fd" : "#7c3aed";
            return (
              <div className="lf-card" style={{ background: dark?"#16102a":"#faf5ff", border:`1px solid ${dark?"#4c1d95":"#e9d5ff"}` }}>
                <SectionHeader title="Daily Activity Insights" icon="📊" action="View Calendar" onAction={() => setTab("calendar")} css={css} />
                <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(120px,1fr))", gap:12 }}>
                  {[
                    { label:"Days archived", val:dailyHistory.length, icon:"📅", color:"#8b5cf6" },
                    { label:"Avg completion", val:`${avgRate}%`, icon:"📈", color:"#ec4899" },
                    { label:"Prod. streak", val:`${streak}d`, icon:"🔥", color:"#f59e0b" },
                    { label:"Done this week", val:weekDone, icon:"⚡", color:"#10b981" },
                    { label:"Done this month", val:monthDone, icon:"🗓", color:"#3b82f6" },
                  ].map(s => (
                    <div key={s.label} style={{ textAlign:"center", background:dark?"#1e1830":"#fff", borderRadius:12, padding:"14px 8px", border:`1px solid ${dark?"#2d2d4a":"#f3e8ff"}` }}>
                      <div style={{ fontSize:20 }}>{s.icon}</div>
                      <div style={{ fontSize:22, fontWeight:700, color:s.color, marginTop:4 }}>{s.val}</div>
                      <div style={{ fontSize:10, color:css.textMuted, marginTop:2, lineHeight:1.3 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    function WeekDayView({ events, view, css, dark, onEdit }) {
      const now = new Date();
      const days = view === "day" ? [now] : Array.from({ length: 7 }, (_, i) => {
        const d = new Date(now); d.setDate(now.getDate() - now.getDay() + i); return d;
      });
      return (
        <div style={{ overflowX: "auto" }}>
          <div style={{ display: "grid", gridTemplateColumns: `repeat(${days.length}, minmax(100px, 1fr))`, gap: 1 }}>
            {days.map(d => {
              const k = d.toISOString().slice(0,10);
              const isToday = k === today();
              const dayEvents = events.filter(e => e.date === k);
              return (
                <div key={k} style={{ borderLeft: `1px solid ${css.border}`, padding: "8px 8px" }}>
                  <div style={{ textAlign: "center", marginBottom: 8 }}>
                    <div style={{ fontSize: 11, color: css.textMuted }}>{DAYS_SHORT[d.getDay()]}</div>
                    <div style={{ width: 28, height: 28, borderRadius: "50%", background: isToday ? "#8b5cf6" : "transparent", color: isToday ? "#fff" : css.text, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 14, fontWeight: isToday ? 600 : 400, margin: "4px auto 0" }}>{d.getDate()}</div>
                  </div>
                  {dayEvents.map(e => (
                    <div key={e.id} style={{ background: dark ? "#312e81" : "#ede9fe", color: "#7c3aed", borderRadius: 6, padding: "4px 8px", fontSize: 11, marginBottom: 4, cursor: "pointer" }} onClick={() => onEdit(e)}>
                      <div style={{ fontWeight: 600 }}>{e.time}</div>
                      <div>{e.title}</div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function Calendar({ events, setEvents, dailyHistory, css, dark }) {
      const now = new Date();
      const [year, setYear] = useState(now.getFullYear());
      const [month, setMonth] = useState(now.getMonth());
      const [view, setView] = useState("month");
      const [modal, setModal] = useState(null);
      const [form, setForm] = useState({ title: "", desc: "", date: today(), time: "09:00", status: "Confirmed" });
      const [historyModal, setHistoryModal] = useState(null); // date string

      const days = daysInMonth(year, month);
      const firstDay = firstDayOfMonth(year, month);

      const eventsForDay = (d) => {
        const k = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        return events.filter(e => e.date === k);
      };
      const historyForDay = (d) => {
        const k = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        return dailyHistory.find(h => h.date === k) || null;
      };

      const saveEvent = () => {
        if (!form.title.trim()) return;
        if (modal === "edit") {
          setEvents(events.map(e => e.id === form.id ? { ...form } : e));
        } else {
          setEvents([...events, { ...form, id: uid() }]);
        }
        setModal(null);
        setForm({ title: "", desc: "", date: today(), time: "09:00", status: "Confirmed" });
      };

      const prevMonth = () => { if (month === 0) { setMonth(11); setYear(y => y-1); } else setMonth(m => m-1); };
      const nextMonth = () => { if (month === 11) { setMonth(0); setYear(y => y+1); } else setMonth(m => m+1); };

      const lavSoft   = dark ? "#1e1b38" : "#faf5ff";
      const lavBorder = dark ? "#4c1d95" : "#e9d5ff";
      const lavText   = dark ? "#c4b5fd" : "#7c3aed";
      const pinkCol   = "#ec4899";

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

                </p>

            </div>

              {["month","week","day"].map(v => (
                <button key={v} className={`lf-btn ${view === v ? "lf-btn-primary" : "lf-btn-ghost"}`} onClick={() => setView(v)} style={{ padding: "6px 14px", textTransform: "capitalize" }}>{v}</button>
              ))}
              <button className="lf-btn lf-btn-primary" onClick={() => { setForm({ title:"", desc:"", date:today(), time:"09:00", status:"Confirmed" }); setModal("add"); }}>+ Add event</button>

          </div>

          {view === "month" && (
            <div className="lf-card" style={{ padding: 0, overflow: "hidden" }}>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "16px 20px", borderBottom: `1px solid ${css.border}` }}>
                <button className="lf-btn lf-btn-ghost" onClick={prevMonth} style={{ padding: "6px 12px" }}>←</button>
                <span style={{ fontWeight: 600, fontSize: 16, color: css.text }}>{MONTHS[month]} {year}</span>
                <button className="lf-btn lf-btn-ghost" onClick={nextMonth} style={{ padding: "6px 12px" }}>→</button>
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", padding: "8px 8px 0" }}>

              </div>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", padding: "0 8px 8px", gap: 2 }}>
                {Array.from({ length: firstDay }).map((_, i) => <div key={`e${i}`} />)}
                {Array.from({ length: days }).map((_, i) => {
                  const d = i + 1;
                  const isToday = d === now.getDate() && month === now.getMonth() && year === now.getFullYear();
                  const evs = eventsForDay(d);
                  const hist = historyForDay(d);
                  const dateKey = `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
                  return (
                    <div key={d} style={{ minHeight: 72, padding: "4px 2px", borderRadius: 8, background: hist ? (dark?"#1e1b30":"#faf5ff") : "transparent", cursor: hist ? "pointer" : "default" }}
                      onClick={() => hist && setHistoryModal(dateKey)}>
                      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:2, paddingRight:2 }}>
                        <div className={`cal-day${isToday ? " today" : ""}`} style={{ width: 32, height: 32 }}>{d}</div>
                        {hist && (
                          <div title={`${hist.completionRate}% completed`} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:1 }}>
                            <div style={{ width:7, height:7, borderRadius:"50%", background: hist.completionRate===100 ? "#10b981" : lavText }} />
                            <div style={{ fontSize:8, color:lavText, fontWeight:700 }}>{hist.completionRate}%</div>
                          </div>
                        )}
                      </div>
                      {evs.slice(0, 2).map(e => (
                        <div key={e.id} style={{ fontSize: 10, padding: "1px 6px", background: dark ? "#312e81" : "#ede9fe", color: "#8b5cf6", borderRadius: 4, marginBottom: 1, overflow: "hidden", whiteSpace: "nowrap", textOverflow: "ellipsis", cursor: "pointer" }}
                          onClick={(ev) => { ev.stopPropagation(); setForm({...e}); setModal("edit"); }}>{e.title}</div>
                      ))}
                      {evs.length > 2 && <div style={{ fontSize: 10, color: css.textMuted, paddingLeft: 6 }}>+{evs.length-2}</div>}
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {(view === "week" || view === "day") && (
            <div className="lf-card">
              <WeekDayView events={events} view={view} css={css} dark={dark} onEdit={(e) => { setForm({...e}); setModal("edit"); }} />
            </div>
          )}

          {/* Daily History log list */}
          {dailyHistory.length > 0 && (
            <div className="lf-card" style={{ background: lavSoft, border: `1px solid ${lavBorder}` }}>
              <SectionHeader title="Daily History Archive" icon="📖" css={css} />
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {[...dailyHistory].sort((a,b) => b.date.localeCompare(a.date)).slice(0,10).map(h => (
                  <div key={h.date} onClick={() => setHistoryModal(h.date)}
                    style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 14px", background:dark?"#1a1830":"#fff", borderRadius:12, cursor:"pointer", border:`1px solid ${dark?"#2d2d4a":"#f3e8ff"}` }}>
                    <div style={{ width:42, height:42, borderRadius:12, background: h.completionRate===100?"#d1fae5":(dark?"#2d1b4a":"#ede9fe"), display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                      <div style={{ fontSize:11, fontWeight:700, color: h.completionRate===100?"#059669":lavText }}>{h.completionRate}%</div>
                      <div style={{ fontSize:9, color:css.textMuted }}>{h.completedCount}/{h.totalCount}</div>
                    </div>
                    <div style={{ flex:1 }}>
                      <div style={{ fontWeight:600, color:css.text, fontSize:14 }}>{fmtFull(h.date)}</div>
                      <div style={{ fontSize:12, color:css.textMuted, marginTop:2 }}>
                        {h.items.filter(i=>i.completed).slice(0,2).map(i=>i.text).join(" · ") || "No items completed"}
                        {h.items.filter(i=>i.completed).length > 2 && ` +${h.items.filter(i=>i.completed).length-2} more`}
                      </div>
                    </div>
                    <div style={{ fontSize:18 }}>{h.completionRate===100?"🌟":h.completionRate>=50?"✨":"💙"}</div>
                  </div>
                ))}
                {dailyHistory.length > 10 && <div style={{ textAlign:"center", fontSize:12, color:css.textMuted, paddingTop:4 }}>+{dailyHistory.length-10} more archived days</div>}
              </div>
            </div>
          )}

          <div className="lf-card">
            <SectionHeader title="All events" icon="📋" css={css} />
            {events.length === 0 && <EmptyState msg="No events yet" icon="📭" css={css} />}
            {[...events].sort((a,b) => a.date > b.date ? 1 : -1).map(e => (
              <div key={e.id} style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 0", borderBottom: `1px solid ${css.border}` }}>
                <div style={{ background: dark ? "#312e81" : "#f5f3ff", color: "#8b5cf6", borderRadius: 8, padding: "4px 10px", fontSize: 12, fontWeight: 600, flexShrink: 0, minWidth: 60, textAlign: "center" }}>
                  <div>{fmt(e.date)}</div><div>{e.time}</div>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontWeight: 500, color: css.text }}>{e.title}</div>
                  {e.desc && <div style={{ fontSize: 12, color: css.textMuted }}>{e.desc}</div>}
                </div>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="lf-btn lf-btn-ghost" style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => { setForm({...e}); setModal("edit"); }}>Edit</button>
                  <button style={{ padding: "4px 10px", fontSize: 12, background: dark ? "#2d1b1b" : "#fee2e2", color: "#ef4444", borderRadius: 8, border: "none", cursor: "pointer" }} onClick={() => setEvents(events.filter(x => x.id !== e.id))}>✕</button>
                </div>
              </div>
            ))}
          </div>

          {/* Event add/edit modal */}
          {modal && (
            <div className="modal-overlay" onClick={() => setModal(null)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontWeight: 600, color: css.text, marginBottom: 16 }}>{modal === "edit" ? "Edit event" : "New event"}</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <input className="lf-input" placeholder="Event title" value={form.title} onChange={e => setForm({...form, title: e.target.value})} />
                  <textarea className="lf-input" placeholder="Description (optional)" value={form.desc} onChange={e => setForm({...form, desc: e.target.value})} rows={2} style={{ resize: "vertical" }} />
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <input className="lf-input" type="date" value={form.date} onChange={e => setForm({...form, date: e.target.value})} />
                    <input className="lf-input" type="time" value={form.time} onChange={e => setForm({...form, time: e.target.value})} />
                  </div>
                  <select className="lf-input" value={form.status} onChange={e => setForm({...form, status: e.target.value})}>
                    {["Confirmed","Tentative","Cancelled"].map(s => <option key={s}>{s}</option>)}
                  </select>
                  <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 8 }}>
                    <button className="lf-btn lf-btn-ghost" onClick={() => setModal(null)}>Cancel</button>
                    <button className="lf-btn lf-btn-primary" onClick={saveEvent}>Save</button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* History detail modal */}
          {historyModal && (() => {
            const record = dailyHistory.find(h => h.date === historyModal);
            if (!record) return null;
            const doneItems = record.items.filter(i=>i.completed);
            const pendItems = record.items.filter(i=>!i.completed);
            return (
              <div className="modal-overlay" onClick={() => setHistoryModal(null)}>
                <div className="modal" onClick={e => e.stopPropagation()} style={{ background: dark?"#1a1830":"#fff", maxWidth:520 }}>
                  {/* Header */}
                  <div style={{ display:"flex", alignItems:"center", gap:12, marginBottom:20 }}>
                    <div style={{ width:48, height:48, borderRadius:14, background:"linear-gradient(135deg,#c084fc,#ec4899)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:22, flexShrink:0 }}>📖</div>
                    <div>
                      <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:20, fontWeight:400, color:css.text }}>{fmtFull(record.date)}</div>
                      <div style={{ fontSize:12, color:lavText, marginTop:2 }}>Daily History Log</div>
                    </div>
                    <button onClick={() => setHistoryModal(null)} style={{ marginLeft:"auto", background:"transparent", border:"none", fontSize:20, color:css.textMuted, cursor:"pointer", lineHeight:1 }}>✕</button>
                  </div>

                  {/* Stats */}
                  <div style={{ display:"flex", gap:10, marginBottom:20 }}>
                    {[
                      { l:"Completion", v:`${record.completionRate}%`, c: record.completionRate===100?"#10b981":lavText },
                      { l:"Done", v:record.completedCount, c:"#ec4899" },
                      { l:"Total", v:record.totalCount, c:css.textMuted },
                    ].map(s => (
                      <div key={s.l} style={{ flex:1, textAlign:"center", background:dark?"#2d1b4a":"#faf5ff", borderRadius:12, padding:"10px 6px", border:`1px solid ${lavBorder}` }}>
                        <div style={{ fontSize:20, fontWeight:700, color:s.c }}>{s.v}</div>
                        <div style={{ fontSize:10, color:css.textMuted, marginTop:2 }}>{s.l}</div>
                      </div>
                    ))}
                  </div>

                  {/* Progress bar */}
                  <div style={{ marginBottom:20 }}>
                    <div style={{ height:8, borderRadius:4, background:dark?"#2d2d4a":"#f3e8ff", overflow:"hidden" }}>
                      <div style={{ height:"100%", borderRadius:4, background:"linear-gradient(90deg,#ec4899,#a855f7)", width:`${record.completionRate}%` }} />
                    </div>
                  </div>

                  {/* Today's Log */}
                  <div style={{ fontSize:11, fontWeight:700, color:css.textMuted, textTransform:"uppercase", letterSpacing:"0.06em", marginBottom:10 }}>Today's Log</div>
                  <div style={{ display:"flex", flexDirection:"column", gap:0, maxHeight:320, overflowY:"auto" }}>
                    {doneItems.map(item => (
                      <div key={item.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 12px", borderBottom:`1px solid ${css.border}`, background:dark?"#1e1830":"#fdf2f8", borderRadius:8, marginBottom:3 }}>
                        <div style={{ width:20, height:20, borderRadius:"50%", background:"#ec4899", display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                          <span style={{ color:"#fff", fontSize:11, lineHeight:1 }}>✓</span>
                        </div>
                        <span style={{ fontSize:14, color:css.text, flex:1 }}>{item.text}</span>
                      </div>
                    ))}
                    {pendItems.map(item => (
                      <div key={item.id} style={{ display:"flex", alignItems:"center", gap:10, padding:"9px 12px", borderBottom:`1px solid ${css.border}`, opacity:0.55, marginBottom:3 }}>
                        <div style={{ width:20, height:20, borderRadius:"50%", border:`2px solid ${css.border}`, display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0 }}>
                          <span style={{ fontSize:10 }}>☐</span>
                        </div>
                        <span style={{ fontSize:14, color:css.text, flex:1, textDecoration:"line-through" }}>{item.text}</span>
                      </div>
                    ))}
                    {record.items.length === 0 && <EmptyState msg="No items were logged this day." icon="📭" css={css} />}
                  </div>

                  <div style={{ marginTop:20, textAlign:"right" }}>
                    <button className="lf-btn lf-btn-ghost" onClick={() => setHistoryModal(null)}>Close</button>
                  </div>
                </div>
              </div>
            );
          })()}
        </div>
      );
    }

    function Tasks({ tasks, setTasks, css, dark }) {
      const [modal, setModal] = useState(false);
      const [filter, setFilter] = useState("All");
      const [sort, setSort] = useState("due");
      const [form, setForm] = useState({ title:"", desc:"", due:today(), priority:"Medium", category:"Personal", status:"To Do" });
      const [editId, setEditId] = useState(null);

      const completed = tasks.filter(t => t.status === "Completed").length;
      const inProg = tasks.filter(t => t.status === "In Progress").length;
      const pct = tasks.length ? Math.round(completed/tasks.length*100) : 0;

      const filtered = tasks
        .filter(t => filter === "All" ? true : t.status === filter)
        .sort((a,b) => sort === "due" ? a.due.localeCompare(b.due) : sort === "priority" ? ["High","Medium","Low"].indexOf(a.priority) - ["High","Medium","Low"].indexOf(b.priority) : a.title.localeCompare(b.title));

      const save = () => {
        if (!form.title.trim()) return;
        if (editId) { setTasks(tasks.map(t => t.id === editId ? { ...form, id: editId } : t)); setEditId(null); }
        else { setTasks([...tasks, { ...form, id: uid() }]); }
        setModal(false);
        setForm({ title:"", desc:"", due:today(), priority:"Medium", category:"Personal", status:"To Do" });
      };

      const cycle = (t) => {
        const next = { "To Do":"In Progress", "In Progress":"Completed", "Completed":"To Do" };
        setTasks(tasks.map(x => x.id === t.id ? { ...x, status: next[x.status] } : x));
      };

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 26, fontWeight: 400, color: css.text }}>Tasks</h2>
            <button className="lf-btn lf-btn-primary" onClick={() => { setForm({ title:"", desc:"", due:today(), priority:"Medium", category:"Personal", status:"To Do" }); setEditId(null); setModal(true); }}>+ New task</button>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px, 1fr))", gap: 12 }}>
            {[
              { label: "Total", val: tasks.length, color: "#8b5cf6" },
              { label: "Completed", val: completed, color: "#10b981" },

    function Habits({ habits, setHabits, css, dark }) {
      const [modal, setModal] = useState(false);
      const [form, setForm] = useState({ name:"", emoji:"🌟", color:"#8b5cf6" });
      const [editId, setEditId] = useState(null);
      const todayStr = today();

      const getStreak = (habit) => {
        let streak = 0, d = new Date();
        while (true) {
          const k = d.toISOString().slice(0,10);
          if (!habit.completions[k]) break;
          streak++; d.setDate(d.getDate()-1);
        }
        return streak;
      };

      const toggle = (hid) => {
        setHabits(habits.map(h => {
          if (h.id !== hid) return h;
          const c = { ...h.completions };
          if (c[todayStr]) delete c[todayStr]; else c[todayStr] = true;
          return { ...h, completions: c };
        }));
      };

      const last7Days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - 6 + i);
        return d.toISOString().slice(0,10);
      });

      const save = () => {
        if (!form.name.trim()) return;
        if (editId) { setHabits(habits.map(h => h.id === editId ? { ...h, ...form } : h)); }
        else { setHabits([...habits, { ...form, id: uid(), completions: {} }]); }
        setModal(false); setEditId(null);
        setForm({ name:"", emoji:"🌟", color:"#8b5cf6" });
      };

      const EMOJIS = ["🌟","🏃","💧","📚","🧘","🥗","💊","💪","🎵","🌿","☀️","🛌","✍️","🧠","❤️","🏋️"];
      const COLORS = ["#8b5cf6","#3b82f6","#10b981","#f59e0b","#ef4444","#ec4899","#06b6d4","#84cc16"];

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 26, fontWeight: 400, color: css.text }}>Habit Tracker</h2>
            <button className="lf-btn lf-btn-primary" onClick={() => { setForm({ name:"", emoji:"🌟", color:"#8b5cf6" }); setEditId(null); setModal(true); }}>+ New habit</button>
          </div>

          <div className="lf-card" style={{ overflowX: "auto" }}>
            <div style={{ display: "grid", gridTemplateColumns: `180px repeat(7, 1fr)`, gap: 4, minWidth: 480 }}>
              <div style={{ fontSize: 13, fontWeight: 600, color: css.textMuted, padding: "4px 0" }}>Habit</div>
              {last7Days.map(d => (
                <div key={d} style={{ textAlign: "center", fontSize: 11, color: d === todayStr ? "#8b5cf6" : css.textMuted, fontWeight: d === todayStr ? 700 : 400, padding: "4px 0" }}>
                  {new Date(d+"T00:00").toLocaleDateString("en-US",{weekday:"short"})}<br/>{new Date(d+"T00:00").getDate()}
                </div>
              ))}
              {habits.map(h => (
                <React.Fragment key={h.id}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, overflow: "hidden" }}>
                    <span style={{ fontSize: 18 }}>{h.emoji}</span>
                    <span style={{ fontSize: 13, color: css.text, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{h.name}</span>
                  </div>
                  {last7Days.map(d => (
                    <div key={`${h.id}${d}`} style={{ display: "flex", alignItems: "center", justifyContent: "center" }}>
                      <div style={{ width: 28, height: 28, borderRadius: 6, background: h.completions[d] ? h.color : "transparent", border: `2px solid ${h.color}`, opacity: h.completions[d] ? 1 : 0.35, cursor: d === todayStr ? "pointer" : "default", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13, color: "#fff" }}
                        onClick={() => d === todayStr && toggle(h.id)}>
                        {h.completions[d] ? "✓" : ""}
                      </div>
                    </div>
                  ))}
                </React.Fragment>
              ))}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(260px, 1fr))", gap: 16 }}>
            {habits.map(h => {
              const streak = getStreak(h);
              const total = Object.keys(h.completions).length;
              const last30 = Array.from({length:30},(_, i) => { const d=new Date(); d.setDate(d.getDate()-29+i); return d.toISOString().slice(0,10); });
              const rate = Math.round(last30.filter(d => h.completions[d]).length / 30 * 100);
              const done = h.completions[todayStr];
              return (
                <div key={h.id} className="lf-card" style={{ borderLeft: `4px solid ${h.color}` }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
                    <span style={{ fontSize: 24 }}>{h.emoji}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 500, color: css.text, fontSize: 15 }}>{h.name}</div>
                      <div style={{ fontSize: 12, color: css.textMuted }}>{rate}% last 30 days</div>
                    </div>
                    <button onClick={() => toggle(h.id)} style={{ width: 36, height: 36, borderRadius: "50%", background: done ? h.color : "transparent", border: `2px solid ${h.color}`, color: done ? "#fff" : h.color, fontSize: 16, display:"flex", alignItems:"center", justifyContent:"center", cursor: "pointer" }}>
                      {done ? "✓" : "○"}
                    </button>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {streak > 0 && <span className="streak-badge">🔥 {streak}d streak</span>}
                    <span style={{ background: dark?"#1e293b":"#f8fafc", color:css.textMuted, borderRadius:20, padding:"4px 10px", fontSize:12 }}>✅ {total} total</span>
                  </div>
                  <div style={{ marginTop: 12 }}>
                    <div className="progress-bar">
                      <div className="progress-fill" style={{ width: `${rate}%`, background: h.color }} />
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8, marginTop: 12, justifyContent: "flex-end" }}>
                    <button className="lf-btn lf-btn-ghost" style={{ padding: "4px 10px", fontSize: 12 }} onClick={() => { setForm({name:h.name,emoji:h.emoji,color:h.color}); setEditId(h.id); setModal(true); }}>Edit</button>
                    <button style={{ padding:"4px 10px", fontSize:12, background:dark?"#2d1b1b":"#fee2e2", color:"#ef4444", borderRadius:8, border:"none", cursor:"pointer" }} onClick={() => setHabits(habits.filter(x => x.id!==h.id))}>Delete</button>
                  </div>
                </div>
              );
            })}
          </div>

          {modal && (
            <div className="modal-overlay" onClick={() => setModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()}>
                <h3 style={{ fontWeight: 600, color: css.text, marginBottom: 16 }}>{editId ? "Edit habit" : "New habit"}</h3>
                <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                  <input className="lf-input" placeholder="Habit name *" value={form.name} onChange={e => setForm({...form,name:e.target.value})} />
                  <div>
                    <label style={{ fontSize: 12, color: css.textMuted, display: "block", marginBottom: 6 }}>Choose emoji</label>
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                      {EMOJIS.map(em => (
                        <button key={em} onClick={() => setForm({...form,emoji:em})} style={{ width:36, height:36, borderRadius:8, border:`2px solid ${form.emoji===em?"#8b5cf6":css.border}`, background:"transparent", fontSize:18, cursor:"pointer" }}>{em}</button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={{ fontSize: 12, color: css.textMuted, display: "block", marginBottom: 6 }}>Choose color</label>
                    <div style={{ display: "flex", gap: 8 }}>
                      {COLORS.map(c => (
                        <div key={c} onClick={() => setForm({...form,color:c})} style={{ width:28, height:28, borderRadius:"50%", background:c, cursor:"pointer", border:`3px solid ${form.color===c?"#fff":"transparent"}`, outline:`2px solid ${form.color===c?c:"transparent"}` }} />
                      ))}
                    </div>
                  </div>
                  <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:8 }}>
                    <button className="lf-btn lf-btn-ghost" onClick={() => setModal(false)}>Cancel</button>
                    <button className="lf-btn lf-btn-primary" onClick={save}>Save habit</button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    function MoodTracker({ moods, setMoods, css, dark }) {
      const [sel, setSel] = useState(null);
      const [note, setNote] = useState("");
      const [saved, setSaved] = useState(false);
      const todayStr = today();
      const todayMood = moods.find(m => m.date === todayStr);

      const saveMood = () => {
        if (!sel) return;
        setMoods([...moods.filter(m => m.date !== todayStr), { date: todayStr, value: sel, note }]);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
      };

      const last14 = Array.from({ length: 14 }, (_, i) => {
        const d = new Date(); d.setDate(d.getDate() - 13 + i);
        return d.toISOString().slice(0,10);
      });

      const avg = moods.length ? (moods.reduce((s,m) => s+m.value, 0) / moods.length).toFixed(1) : "—";
      const recent = [...moods].sort((a,b) => b.date.localeCompare(a.date)).slice(0,10);

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 26, fontWeight: 400, color: css.text }}>Mood Tracker</h2>

          <div className="lf-card">
            <h3 style={{ fontWeight: 600, color: css.text, marginBottom: 4 }}>How are you feeling today?</h3>
            <p style={{ fontSize: 13, color: css.textMuted, marginBottom: 16 }}>{fmtFull(todayStr)}</p>
            <div style={{ display: "flex", gap: 16, justifyContent: "center", flexWrap: "wrap", marginBottom: 16 }}>
              {MOODS.map(m => (
                <button key={m.value} onClick={() => setSel(m.value)} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:6, padding:"12px 16px", borderRadius:14, border:`2px solid ${sel===m.value||todayMood?.value===m.value ? m.color:"transparent"}`, background: sel===m.value||todayMood?.value===m.value ? (dark?"#1c1c2e":m.color+"20") : "transparent", cursor:"pointer" }}>
                  <span style={{ fontSize: 32 }}>{m.icon}</span>
                  <span style={{ fontSize: 11, color: css.textMuted }}>{m.label}</span>
                </button>
              ))}
            </div>
            <textarea className="lf-input" placeholder="Add a note about your day (optional)..." rows={2} style={{ resize: "vertical" }}
              value={note || todayMood?.note || ""} onChange={e => setNote(e.target.value)} />
            <div style={{ display: "flex", alignItems: "center", gap: 12, marginTop: 12 }}>
              <button className="lf-btn lf-btn-primary" onClick={saveMood}>{todayMood ? "Update mood" : "Log mood"}</button>
              {saved && <span style={{ fontSize: 13, color: "#10b981" }}>✓ Saved!</span>}
            </div>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(130px,1fr))", gap: 12 }}>
            {[
              { label: "Days tracked", val: moods.length, color: "#8b5cf6" },
              { label: "Avg mood (1-5)", val: avg, color: "#f59e0b" },
              { label: "Today's mood", val: todayMood ? MOODS.find(m=>m.value===todayMood.value)?.icon : "—", color: "#10b981" },
            ].map(s => (
              <div key={s.label} className="lf-card" style={{ textAlign:"center", padding:16 }}>
                <div style={{ fontSize: 24, fontWeight: 600, color: s.color }}>{s.val}</div>
                <div style={{ fontSize: 12, color: css.textMuted, marginTop:2 }}>{s.label}</div>
              </div>
            ))}
          </div>

          <div className="lf-card">
            <h3 style={{ fontWeight: 600, color: css.text, marginBottom: 16, fontSize: 15 }}>Last 14 days</h3>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 4, height: 80 }}>
              {last14.map(d => {
                const m = moods.find(x => x.date === d);
                const h = m ? (m.value / 5) * 72 : 0;
                const moodData = m ? MOODS.find(x => x.value === m.value) : null;
                return (
                  <div key={d} style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", gap: 2 }}>
                    <div style={{ width: "100%", height: h, background: moodData?.color || "transparent", borderRadius: "4px 4px 0 0", minHeight: m?4:0, opacity: 0.85 }} />
                    <div style={{ fontSize: 9, color: css.textMuted, marginTop: 4 }}>{new Date(d+"T00:00").getDate()}</div>
                  </div>
                );
              })}
            </div>
            <div style={{ display: "flex", gap: 12, marginTop: 16, flexWrap: "wrap" }}>
              {MOODS.map(m => (
                <div key={m.value} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, color: css.textMuted }}>
                  <div style={{ width: 8, height: 8, borderRadius: 2, background: m.color }} />{m.label}
                </div>
              ))}
            </div>
          </div>

          <div className="lf-card">
            <h3 style={{ fontWeight: 600, color: css.text, marginBottom: 12, fontSize: 15 }}>Mood history</h3>
            {recent.length === 0 && <EmptyState msg="No mood entries yet" icon="💭" css={css} />}
            {recent.map(m => {
              const moodData = MOODS.find(x => x.value === m.value);
              return (
                <div key={m.date} style={{ display: "flex", alignItems: "center", gap: 12, padding: "10px 0", borderBottom: `1px solid ${css.border}` }}>

                  <div style={{ flex: 1 }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <span style={{ fontWeight: 500, color: css.text, fontSize: 14 }}>{moodData?.label}</span>
                      <span style={{ fontSize: 11, color: css.textMuted }}>{fmt(m.date)}</span>
                    </div>
                    {m.note && <div style={{ fontSize: 12, color: css.textMuted }}>{m.note}</div>}
                  </div>
                  <button style={{ fontSize:11, color:"#ef4444", background:"transparent", border:"none", cursor:"pointer" }} onClick={() => setMoods(moods.filter(x => x.date !== m.date))}>✕</button>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

                  <div style={{ fontSize: 11, fontWeight: 600, color: "#8b5cf6", marginBottom: 4 }}>✨ Today's prompt</div>
