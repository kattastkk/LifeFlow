              )}
              <input className="lf-input" placeholder="Entry title (optional)" value={form.title} onChange={e => setForm({...form,title:e.target.value})} style={{ marginBottom: 12, fontSize: 16 }} />
              <textarea className="lf-input" placeholder="Write your thoughts here..." value={form.content} onChange={e => setForm({...form,content:e.target.value})} rows={12} style={{ resize: "vertical", lineHeight: 1.7 }} />
              <div style={{ display: "flex", gap: 10, justifyContent: "flex-end", marginTop: 14 }}>
                <button className="lf-btn lf-btn-ghost" onClick={() => setView("list")}>Cancel</button>
                <button className="lf-btn lf-btn-primary" onClick={save}>Save entry</button>
              </div>
            </div>
          )}

          {view === "list" && (
            <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
              <div style={{ background: dark?"#1e1b4b":"#f5f3ff", border:`1px solid ${dark?"#312e81":"#ddd6fe"}`, borderRadius:14, padding:"16px 20px" }}>
                <div style={{ fontSize: 11, fontWeight: 600, color: "#8b5cf6", marginBottom: 6 }}>✨ Today's reflection prompt</div>
                <div style={{ fontSize: 15, color: dark?"#c4b5fd":"#6d28d9", fontStyle:"italic", marginBottom: 12 }}>"{prompt}"</div>
                <button className="lf-btn lf-btn-primary" onClick={() => { setForm({ title:"", content:"", date:today(), prompt }); setEditId(null); setView("write"); }} style={{ fontSize: 13 }}>Start writing</button>
              </div>
              <input className="lf-input" placeholder="🔍 Search entries..." value={search} onChange={e => setSearch(e.target.value)} />
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(280px,1fr))", gap: 16 }}>
                {filtered.length === 0 && <div style={{ gridColumn:"1/-1" }}><EmptyState msg={search ? "No entries found" : "Start writing your first entry"} icon="✍️" css={css} /></div>}
                {filtered.map(j => (
                  <div key={j.id} className="lf-card" style={{ cursor:"pointer" }} onClick={() => { setForm({...j}); setEditId(j.id); setView("write"); }}>
                    <div style={{ fontSize: 11, color: "#8b5cf6", fontWeight: 600, marginBottom: 4 }}>📅 {fmtFull(j.date)}</div>
                    {j.title && <div style={{ fontWeight: 600, color: css.text, marginBottom: 6 }}>{j.title}</div>}
                    {j.prompt && <div style={{ fontSize: 11, fontStyle:"italic", color: css.textMuted, marginBottom: 6 }}>{j.prompt}</div>}
                    <div style={{ fontSize: 13, color: css.textMuted, overflow:"hidden", display:"-webkit-box", WebkitLineClamp:3, WebkitBoxOrient:"vertical", lineHeight:1.6 }}>{j.content}</div>
                    <div style={{ display:"flex", justifyContent:"flex-end", marginTop:12 }}>
                      <button onClick={e => { e.stopPropagation(); setJournals(journals.filter(x=>x.id!==j.id)); }} style={{ fontSize:11, color:"#ef4444", background:"transparent", border:"none", cursor:"pointer" }}>Delete</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── To Do List Page ──────────────────────────────────────────────────────
    function TodoListPage({ todoItems, setTodoItems, projects, setProjects, css, dark }) {
      const [input, setInput] = useState("");
      const [editId, setEditId] = useState(null);
      const [editText, setEditText] = useState("");
      const [selectedProject, setSelectedProject] = useState("inbox");
      const [newProjectName, setNewProjectName] = useState("");

      const inScope = (i) => selectedProject === "inbox" ? !i.projectId : i.projectId === selectedProject;
      const scoped  = todoItems.filter(inScope);

      const done      = scoped.filter(i => i.completed).length;
      const total     = scoped.length;
      const remaining = total - done;
      const pct       = total ? Math.round(done / total * 100) : 0;

      const sorted = [...scoped].sort((a, b) => {
        if (a.completed === b.completed) return new Date(b.createdAt) - new Date(a.createdAt);
        return a.completed - b.completed;
      });

      const addItem = () => {
        const t = input.trim();
        if (!t) return;
        setTodoItems([...todoItems, { id: uid(), text: t, completed: false, createdAt: new Date().toISOString(), projectId: selectedProject === "inbox" ? null : selectedProject }]);
        setInput("");
      };
      const toggle    = (id) => setTodoItems(todoItems.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const del       = (id) => setTodoItems(todoItems.filter(i => i.id !== id));
      const saveEdit  = (id) => {
        if (!editText.trim()) return;
        setTodoItems(todoItems.map(i => i.id === id ? { ...i, text: editText.trim() } : i));
        setEditId(null); setEditText("");
      };
      const clearDone = () => setTodoItems(todoItems.filter(i => !(i.completed && inScope(i))));

      const addProject = () => {
        const name = newProjectName.trim();
        if (!name) return;
        const proj = { id: uid(), name, emoji: "📁", createdAt: new Date().toISOString() };
        setProjects([...projects, proj]);
        setNewProjectName("");
        setSelectedProject(proj.id);
      };
      const deleteProject = (id) => {
        setProjects(projects.filter(p => p.id !== id));
        setTodoItems(todoItems.map(i => i.projectId === id ? { ...i, projectId: null } : i));
        if (selectedProject === id) setSelectedProject("inbox");
      };

      const activeProject = projects.find(p => p.id === selectedProject);

      const blue      = "#3b82f6";
      const blueSoft  = dark ? "#0c1a35" : "#eff6ff";
      const blueBorder= dark ? "#1e3a5f" : "#bfdbfe";
      const blueText  = dark ? "#93c5fd" : "#1d4ed8";
      const lavSoft   = dark ? "#1a1535" : "#f5f3ff";
      const lavBorder = dark ? "#312e81" : "#e0e7ff";

      return (
        <div style={{ display:"flex", gap:20, maxWidth:940, margin:"0 auto", alignItems:"flex-start" }}>

          {/* Projects sidebar */}
          <div className="lf-card" style={{ width:200, flexShrink:0, padding:14, display:"flex", flexDirection:"column", gap:4 }}>
            <div style={{ fontSize:11, fontWeight:700, color:css.textMuted, letterSpacing:"0.06em", textTransform:"uppercase", padding:"0 6px 6px" }}>Projects</div>
            <div className={`nav-item${selectedProject === "inbox" ? " active" : ""}`} style={{ color: selectedProject === "inbox" ? "#fff" : css.textMuted }} onClick={() => setSelectedProject("inbox")}>
              <span>📥</span><span>Inbox</span>
            </div>
            {projects.map(p => (
              <div key={p.id} style={{ display:"flex", alignItems:"center", gap:2 }}>
                <div className={`nav-item${selectedProject === p.id ? " active" : ""}`} style={{ flex:1, minWidth:0, color: selectedProject === p.id ? "#fff" : css.textMuted }} onClick={() => setSelectedProject(p.id)}>
                  <span>{p.emoji}</span><span style={{ overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{p.name}</span>
                </div>
                <button onClick={() => deleteProject(p.id)} title="Delete project" style={{ background:"transparent", border:"none", color:"#ef4444", opacity:0.6, cursor:"pointer", fontSize:12, padding:"4px 6px", flexShrink:0 }}>✕</button>
              </div>
            ))}
            <div style={{ display:"flex", gap:6, marginTop:8 }}>
              <input
                className="lf-input"
                placeholder="New project"
                value={newProjectName}
                onChange={e => setNewProjectName(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addProject()}
                style={{ padding:"6px 10px", fontSize:13 }}
              />
              <button onClick={addProject} style={{ padding:"6px 10px", borderRadius:8, background:"#db2777", color:"#fff", border:"none", cursor:"pointer", fontSize:13, flexShrink:0 }}>+</button>
            </div>
          </div>

        <div style={{ display:"flex", flexDirection:"column", gap:24, flex:1, minWidth:0 }}>

          {/* Header */}
          <div style={{ display:"flex", alignItems:"center", gap:14 }}>
            <div style={{ width:48, height:48, borderRadius:16, background:"linear-gradient(135deg,#93c5fd,#818cf8)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, flexShrink:0 }}>{selectedProject === "inbox" ? "📥" : (activeProject?.emoji || "📝")}</div>
            <div>
              <h2 style={{ fontFamily:"'DM Serif Display',serif", fontSize:28, fontWeight:400, color:css.text, lineHeight:1 }}>{selectedProject === "inbox" ? "Inbox" : (activeProject?.name || "To Do List")}</h2>
              <p style={{ fontSize:13, color:css.textMuted, marginTop:4 }}>Small things that help keep life organized.</p>
            </div>
          </div>

          {/* Stats */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:12 }}>
            {[
              { label:"Total",     val:total,     icon:"📋", grad:"linear-gradient(135deg,#818cf8,#6366f1)" },
              { label:"Completed", val:done,      icon:"✅", grad:"linear-gradient(135deg,#34d399,#059669)" },
              { label:"Remaining", val:remaining, icon:"⏳", grad:"linear-gradient(135deg,#93c5fd,#3b82f6)" },
            ].map(s => (
              <div key={s.label} className="lf-card" style={{ textAlign:"center", padding:"16px 12px", position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", top:-14, right:-14, width:64, height:64, borderRadius:"50%", background:s.grad, opacity:0.09 }} />
                <div style={{ fontSize:22 }}>{s.icon}</div>
                <div style={{ fontSize:26, fontWeight:700, color:css.text, marginTop:4 }}>{s.val}</div>
                <div style={{ fontSize:11, color:css.textMuted, marginTop:1 }}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* Progress bar */}
          {total > 0 && (
            <div className="lf-card" style={{ padding:"16px 20px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                <span style={{ fontSize:14, fontWeight:600, color:css.text }}>Completion progress</span>
                <span style={{ fontSize:20, fontWeight:700, background:"linear-gradient(90deg,#3b82f6,#818cf8)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>{pct}%</span>
              </div>
              <div style={{ height:10, borderRadius:5, background:dark?"#1e293b":"#e0e7ff", overflow:"hidden" }}>
                <div style={{ height:"100%", borderRadius:5, background:"linear-gradient(90deg,#60a5fa,#818cf8)", width:`${pct}%`, transition:"width 0.5s ease" }} />
              </div>
              {pct===100 && <div style={{ marginTop:10, fontSize:13, color:blueText, textAlign:"center", fontWeight:500 }}>🎉 All items checked — great job!</div>}
            </div>
          )}

          {/* Quick add */}
          <div style={{ background:blueSoft, border:`1px solid ${blueBorder}`, borderRadius:16, padding:"16px 18px" }}>
            <div style={{ fontSize:11, fontWeight:700, color:blueText, marginBottom:10, letterSpacing:"0.05em", textTransform:"uppercase" }}>✦ Add item</div>
            <div style={{ display:"flex", gap:10 }}>
              <input
                className="lf-input"
                placeholder="e.g. Clean desk, Reply to messages, Backup files…"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key==="Enter" && addItem()}
                style={{ flex:1, background:dark?"#0a1525":"#fff", borderColor:blueBorder }}
              />
              <button onClick={addItem} style={{ padding:"10px 20px", borderRadius:10, background:"linear-gradient(135deg,#3b82f6,#6366f1)", color:"#fff", fontWeight:600, fontSize:14, border:"none", cursor:"pointer", flexShrink:0 }}>
                + Add
              </button>
            </div>
            <div style={{ fontSize:11, color:blueText, marginTop:8, opacity:0.7 }}>Press Enter to add quickly</div>
          </div>

          {/* Checklist */}
          <div className="lf-card" style={{ padding:0, overflow:"hidden" }}>
            {sorted.filter(i=>!i.completed).length > 0 && (
              <div>
                <div style={{ padding:"14px 20px 6px", fontSize:11, fontWeight:700, color:css.textMuted, letterSpacing:"0.06em", textTransform:"uppercase" }}>
                  ⏳ To do — {remaining} remaining
                </div>
                {sorted.filter(i=>!i.completed).map((item,idx,arr) => (
                  <TodoItem key={item.id} item={item} editId={editId} editText={editText} setEditId={setEditId} setEditText={setEditText} saveEdit={saveEdit} toggle={toggle} del={del} isLast={idx===arr.length-1} css={css} dark={dark} accent={blue} />
                ))}
              </div>
            )}
            {sorted.filter(i=>i.completed).length > 0 && (
              <div>
                <div style={{ padding:"14px 20px 6px", fontSize:11, fontWeight:700, color:css.textMuted, letterSpacing:"0.06em", textTransform:"uppercase", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span>✅ Completed — {done}</span>
                  <button onClick={clearDone} style={{ fontSize:11, color:"#ef4444", background:"transparent", border:"none", cursor:"pointer", fontWeight:500 }}>Clear all</button>
                </div>
                {sorted.filter(i=>i.completed).map((item,idx,arr) => (
                  <TodoItem key={item.id} item={item} editId={editId} editText={editText} setEditId={setEditId} setEditText={setEditText} saveEdit={saveEdit} toggle={toggle} del={del} isLast={idx===arr.length-1} css={css} dark={dark} accent={blue} />
                ))}
              </div>
            )}
            {total === 0 && (
              <div style={{ padding:"40px 20px", textAlign:"center" }}>
                <div style={{ fontSize:48, marginBottom:12 }}>💙</div>
                <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:20, color:css.text, fontWeight:400 }}>Your list is empty</div>
                <div style={{ fontSize:13, color:css.textMuted, marginTop:6 }}>Add your first item above to get started.</div>
              </div>
            )}
          </div>
        </div>
        </div>
      );
    }

    function TodoItem({ item, editId, editText, setEditId, setEditText, saveEdit, toggle, del, isLast, css, dark, accent }) {
      return (
        <div style={{ display:"flex", alignItems:"center", gap:12, padding:"12px 20px", borderBottom:isLast?"none":`1px solid ${css.border}` }}>
          <button onClick={() => toggle(item.id)} style={{ width:24, height:24, borderRadius:6, flexShrink:0, border:`2px solid ${item.completed ? accent : css.border}`, background:item.completed ? accent : "transparent", display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", transition:"all 0.18s" }}>
            {item.completed && <span style={{ color:"#fff", fontSize:12, lineHeight:1 }}>✓</span>}
          </button>
          {editId === item.id ? (
            <input className="lf-input" autoFocus value={editText} onChange={e => setEditText(e.target.value)}
              onKeyDown={e => { if(e.key==="Enter") saveEdit(item.id); if(e.key==="Escape"){setEditId(null);setEditText("");} }}
              style={{ flex:1, padding:"6px 10px", fontSize:14 }} />
          ) : (
            <span onDoubleClick={() => {setEditId(item.id);setEditText(item.text);}}
              style={{ flex:1, fontSize:14, color:css.text, textDecoration:item.completed?"line-through":"none", opacity:item.completed?0.45:1, cursor:"text", lineHeight:1.5 }}>
              {item.text}
            </span>
          )}
          <div style={{ display:"flex", gap:4, flexShrink:0 }}>
            {editId === item.id ? (
              <>
                <button onClick={() => saveEdit(item.id)} style={{ fontSize:12, padding:"3px 10px", borderRadius:8, background:accent, color:"#fff", border:"none", cursor:"pointer", fontWeight:500 }}>Save</button>
                <button onClick={() => {setEditId(null);setEditText("");}} style={{ fontSize:12, padding:"3px 8px", borderRadius:8, background:css.hover, color:css.textMuted, border:"none", cursor:"pointer" }}>✕</button>
              </>
            ) : (
              <>
                <button onClick={() => {setEditId(item.id);setEditText(item.text);}} style={{ fontSize:13, padding:"3px 8px", borderRadius:8, background:"transparent", color:css.textMuted, border:"none", cursor:"pointer", opacity:0.6 }} title="Edit">✏️</button>
                <button onClick={() => del(item.id)} style={{ fontSize:13, padding:"3px 8px", borderRadius:8, background:"transparent", color:"#ef4444", border:"none", cursor:"pointer", opacity:0.7 }} title="Delete">✕</button>
              </>
            )}
          </div>
        </div>
      );
    }

    // ── Want To Do Page ──────────────────────────────────────────────────────
    const WANT_CATS = ["Learning","Travel","Hobby","Career","Personal Growth","Fun","Other"];
    const WANT_CAT_COLORS = {
      Learning:"#f59e0b", Travel:"#06b6d4", Hobby:"#a78bfa",
      Career:"#3b82f6", "Personal Growth":"#10b981", Fun:"#f97316", Other:"#94a3b8"
    };
    const WANT_CAT_BG_LIGHT = {
      Learning:"#fffbeb", Travel:"#ecfeff", Hobby:"#f5f3ff",
      Career:"#eff6ff", "Personal Growth":"#f0fdf4", Fun:"#fff7ed", Other:"#f8fafc"
    };
    const WANT_CAT_BG_DARK = {
      Learning:"#292000", Travel:"#002830", Hobby:"#1e0d3e",
      Career:"#0c1a35", "Personal Growth":"#062010", Fun:"#2d1200", Other:"#1a1f2e"
    };

    function WantToDoPage({ wantItems, setWantItems, css, dark }) {
      const [modal, setModal] = useState(false);
      const [editId, setEditId] = useState(null);
      const [filterCat, setFilterCat] = useState("All");
      const [search, setSearch] = useState("");
      const [form, setForm] = useState({ title:"", category:"Learning", note:"", completed:false });

      const done  = wantItems.filter(i => i.completed).length;
      const total = wantItems.length;
      const pct   = total ? Math.round(done / total * 100) : 0;

      const openAdd  = () => { setForm({ title:"", category:"Learning", note:"", completed:false }); setEditId(null); setModal(true); };
      const openEdit = (item) => { setForm({ title:item.title, category:item.category, note:item.note||"", completed:item.completed }); setEditId(item.id); setModal(true); };

      const save = () => {
        if (!form.title.trim()) return;
        if (editId) {
          setWantItems(wantItems.map(i => i.id===editId ? { ...i, ...form } : i));
        } else {
          setWantItems([...wantItems, { id:uid(), ...form, createdAt:new Date().toISOString() }]);
        }
        setModal(false); setEditId(null);
      };

      const toggle = (id) => setWantItems(wantItems.map(i => i.id===id ? { ...i, completed:!i.completed } : i));
      const del    = (id) => setWantItems(wantItems.filter(i => i.id!==id));

      const filtered = wantItems
        .filter(i => filterCat==="All" || i.category===filterCat)
        .filter(i => (i.title+i.note+i.category).toLowerCase().includes(search.toLowerCase()))
        .sort((a,b) => a.completed - b.completed || new Date(b.createdAt)-new Date(a.createdAt));

      const pink     = "#f472b6";
      const peach    = "#fb923c";
      const pinkSoft = dark ? "#2d0a1e" : "#fdf2f8";
      const pinkBord = dark ? "#6d1a50" : "#fbcfe8";
      const pinkText = dark ? "#f9a8d4" : "#be185d";

      // Cat counts
      const catCounts = WANT_CATS.reduce((acc, c) => { acc[c] = wantItems.filter(i=>i.category===c).length; return acc; }, {});

      return (
        <div style={{ display:"flex", flexDirection:"column", gap:24 }}>

          {/* Header */}
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:12 }}>
            <div style={{ display:"flex", alignItems:"center", gap:14 }}>
              <div style={{ width:48, height:48, borderRadius:16, background:"linear-gradient(135deg,#f9a8d4,#fb923c)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:24, flexShrink:0 }}>🌟</div>
              <div>
                <h2 style={{ fontFamily:"'DM Serif Display',serif", fontSize:28, fontWeight:400, color:css.text, lineHeight:1 }}>Want To Do</h2>
                <p style={{ fontSize:13, color:css.textMuted, marginTop:4 }}>Dreams, ideas, and experiences I want to explore.</p>
              </div>
            </div>
            <button onClick={openAdd} style={{ padding:"10px 22px", borderRadius:12, background:"linear-gradient(135deg,#f472b6,#fb923c)", color:"#fff", fontWeight:600, fontSize:14, border:"none", cursor:"pointer" }}>
              + Add goal
            </button>
          </div>

          {/* Stats */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(130px,1fr))", gap:12 }}>
            {[
              { label:"Total goals",   val:total,      icon:"🌟", grad:"linear-gradient(135deg,#f9a8d4,#f472b6)" },
              { label:"Achieved",      val:done,       icon:"🏆", grad:"linear-gradient(135deg,#fcd34d,#fb923c)" },
              { label:"Still dreaming",val:total-done, icon:"💭", grad:"linear-gradient(135deg,#c4b5fd,#a78bfa)" },
              { label:"Completion",    val:`${pct}%`,  icon:"📊", grad:"linear-gradient(135deg,#86efac,#10b981)" },
            ].map(s => (
              <div key={s.label} className="lf-card" style={{ textAlign:"center", padding:"16px 12px", position:"relative", overflow:"hidden" }}>
                <div style={{ position:"absolute", top:-12, right:-12, width:60, height:60, borderRadius:"50%", background:s.grad, opacity:0.1 }} />
                <div style={{ fontSize:22 }}>{s.icon}</div>
                <div style={{ fontSize:22, fontWeight:700, color:css.text, marginTop:4 }}>{s.val}</div>
                <div style={{ fontSize:11, color:css.textMuted, marginTop:1 }}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* Progress */}
          {total > 0 && (
            <div className="lf-card" style={{ padding:"16px 20px" }}>
              <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:10 }}>
                <span style={{ fontSize:14, fontWeight:600, color:css.text }}>Goals achieved</span>
                <span style={{ fontSize:20, fontWeight:700, background:"linear-gradient(90deg,#f472b6,#fb923c)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>{pct}%</span>
              </div>
              <div style={{ height:10, borderRadius:5, background:dark?"#2d1020":"#fce7f3", overflow:"hidden" }}>
                <div style={{ height:"100%", borderRadius:5, background:"linear-gradient(90deg,#f472b6,#fb923c)", width:`${pct}%`, transition:"width 0.5s ease" }} />
              </div>
            </div>
          )}

          {/* Category chips */}
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", alignItems:"center" }}>
            <button onClick={() => setFilterCat("All")} style={{ padding:"6px 14px", borderRadius:20, fontSize:12, fontWeight:600, border:`1.5px solid ${filterCat==="All"?pink:css.border}`, background:filterCat==="All"?pink:"transparent", color:filterCat==="All"?"#fff":css.textMuted, cursor:"pointer" }}>
              All ({total})
            </button>
            {WANT_CATS.filter(c => catCounts[c]>0).map(c => (
              <button key={c} onClick={() => setFilterCat(c===filterCat?"All":c)} style={{ padding:"6px 14px", borderRadius:20, fontSize:12, fontWeight:600, border:`1.5px solid ${filterCat===c?(WANT_CAT_COLORS[c]||pink):css.border}`, background:filterCat===c?(WANT_CAT_COLORS[c]||pink):"transparent", color:filterCat===c?"#fff":css.textMuted, cursor:"pointer" }}>
                {c} ({catCounts[c]})
              </button>
            ))}
          </div>

          {/* Search */}
          <input className="lf-input" placeholder="🔍 Search goals, ideas, dreams…" value={search} onChange={e => setSearch(e.target.value)} />

          {/* Goal cards */}
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))", gap:16 }}>
            {filtered.length === 0 && (
              <div style={{ gridColumn:"1/-1" }}>
                <div style={{ textAlign:"center", padding:"48px 20px" }}>
                  <div style={{ fontSize:52, marginBottom:12 }}>🌸</div>
                  <div style={{ fontFamily:"'DM Serif Display',serif", fontSize:20, color:css.text }}>
                    {search||filterCat!=="All" ? "No matches found" : "Your dream list awaits"}
                  </div>
                  <div style={{ fontSize:13, color:css.textMuted, marginTop:6 }}>
                    {search||filterCat!=="All" ? "Try a different search or filter." : "Start adding things you want to do, learn, and experience."}
                  </div>
                </div>
              </div>
            )}
            {filtered.map(item => {
              const catColor = WANT_CAT_COLORS[item.category] || "#94a3b8";
              const cardBg   = dark ? (WANT_CAT_BG_DARK[item.category]||"#1a1a2e") : (WANT_CAT_BG_LIGHT[item.category]||"#fff");
              return (
                <div key={item.id} className="lf-card" style={{ background:cardBg, border:`1px solid ${catColor}30`, position:"relative", overflow:"hidden", opacity:item.completed?0.7:1 }}>
                  {/* Decorative blob */}
                  <div style={{ position:"absolute", top:-20, right:-20, width:80, height:80, borderRadius:"50%", background:catColor, opacity:0.07, pointerEvents:"none" }} />

                  {/* Category badge */}
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                    <span style={{ fontSize:11, padding:"3px 10px", borderRadius:20, background:catColor+"22", color:catColor, fontWeight:700 }}>{item.category}</span>
                    {item.completed && <span style={{ fontSize:11, padding:"3px 10px", borderRadius:20, background:"#d1fae5", color:"#059669", fontWeight:700 }}>✓ Achieved</span>}
                  </div>

                  {/* Title */}
                  <div style={{ fontWeight:600, fontSize:15, color:css.text, marginBottom:item.note?6:0, textDecoration:item.completed?"line-through":"none", lineHeight:1.4 }}>
                    {item.title}
                  </div>

                  {/* Note */}
                  {item.note && (
                    <div style={{ fontSize:12, color:css.textMuted, lineHeight:1.5, marginBottom:8 }}>{item.note}</div>
                  )}

                  {/* Footer */}
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginTop:12 }}>
                    <span style={{ fontSize:10, color:css.textMuted }}>
                      {new Date(item.createdAt).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
                    </span>
                    <div style={{ display:"flex", gap:6 }}>
                      <button onClick={() => toggle(item.id)} style={{ fontSize:11, padding:"4px 10px", borderRadius:8, border:`1.5px solid ${catColor}`, background:item.completed?catColor:"transparent", color:item.completed?"#fff":catColor, cursor:"pointer", fontWeight:600 }}>
                        {item.completed ? "✓ Done" : "Mark done"}
                      </button>
                      <button onClick={() => openEdit(item)} style={{ fontSize:12, padding:"4px 8px", borderRadius:8, background:css.hover, color:css.textMuted, border:"none", cursor:"pointer" }}>✏️</button>
                      <button onClick={() => del(item.id)} style={{ fontSize:12, padding:"4px 8px", borderRadius:8, background:"transparent", color:"#ef4444", border:"none", cursor:"pointer" }}>✕</button>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>

          {/* Add / Edit Modal */}
          {modal && (
            <div className="modal-overlay" onClick={() => setModal(false)}>
              <div className="modal" onClick={e => e.stopPropagation()} style={{ background:css.card }}>
                <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:20 }}>
                  <div style={{ width:36, height:36, borderRadius:10, background:"linear-gradient(135deg,#f9a8d4,#fb923c)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:18 }}>🌟</div>
                  <h3 style={{ fontWeight:600, color:css.text, fontSize:17 }}>{editId ? "Edit goal" : "Add new goal"}</h3>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
                  <div>
                    <label style={{ fontSize:12, color:css.textMuted, display:"block", marginBottom:5, fontWeight:600 }}>Goal / Dream *</label>
                    <input className="lf-input" placeholder="e.g. Visit Japan, Learn Blender…" value={form.title} onChange={e => setForm({...form,title:e.target.value})} />
                  </div>
                  <div>
                    <label style={{ fontSize:12, color:css.textMuted, display:"block", marginBottom:5, fontWeight:600 }}>Category</label>
                    <div style={{ display:"flex", flexWrap:"wrap", gap:8 }}>
                      {WANT_CATS.map(c => (
                        <button key={c} onClick={() => setForm({...form,category:c})} style={{ padding:"5px 12px", borderRadius:20, fontSize:12, fontWeight:600, border:`1.5px solid ${form.category===c?(WANT_CAT_COLORS[c]||pink):css.border}`, background:form.category===c?(WANT_CAT_COLORS[c]||pink):"transparent", color:form.category===c?"#fff":css.textMuted, cursor:"pointer" }}>
                          {c}
                        </button>
                      ))}
                    </div>
                  </div>
                  <div>
                    <label style={{ fontSize:12, color:css.textMuted, display:"block", marginBottom:5, fontWeight:600 }}>Notes (optional)</label>
                    <textarea className="lf-input" placeholder="Why do you want this? Any details…" value={form.note} onChange={e => setForm({...form,note:e.target.value})} rows={3} style={{ resize:"vertical" }} />
                  </div>
                  {editId && (
                    <label style={{ display:"flex", alignItems:"center", gap:10, fontSize:14, color:css.text, cursor:"pointer" }}>
                      <input type="checkbox" checked={form.completed} onChange={e => setForm({...form,completed:e.target.checked})} style={{ width:16, height:16 }} />
                      Mark as achieved
                    </label>
                  )}
                  <div style={{ display:"flex", gap:10, justifyContent:"flex-end", marginTop:4 }}>
                    <button className="lf-btn lf-btn-ghost" onClick={() => setModal(false)}>Cancel</button>
                    <button onClick={save} style={{ padding:"10px 22px", borderRadius:10, background:"linear-gradient(135deg,#f472b6,#fb923c)", color:"#fff", fontWeight:600, fontSize:14, border:"none", cursor:"pointer" }}>
                      {editId ? "Save changes" : "Add goal"}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ── Today Page ────────────────────────────────────────────────────────────
    function TodayPage({ todayItems, setTodayItems, dailyHistory, setDailyHistory, css, dark }) {
      const [input, setInput] = useState("");
      const [editId, setEditId] = useState(null);
      const [editText, setEditText] = useState("");
      const [endMsg, setEndMsg] = useState(""); // "" | "saved" | "already" | "empty"

      const todayStr = today();
      const done  = todayItems.filter(i => i.completed).length;
      const total = todayItems.length;
      const remaining = total - done;
      const pct   = total ? Math.round(done / total * 100) : 0;
      const alreadyArchived = dailyHistory.some(h => h.date === todayStr);

      const sorted = [...todayItems].sort((a, b) => {
        if (a.completed === b.completed) return new Date(b.createdAt) - new Date(a.createdAt);
        return a.completed - b.completed;
      });

      const addItem = () => {
        const t = input.trim();
        if (!t) return;
        setTodayItems([...todayItems, { id: uid(), text: t, completed: false, createdAt: new Date().toISOString() }]);
        setInput("");
      };

      const toggle = (id) => setTodayItems(todayItems.map(i => i.id === id ? { ...i, completed: !i.completed } : i));
      const del    = (id) => setTodayItems(todayItems.filter(i => i.id !== id));
      const saveEdit = (id) => {
        if (!editText.trim()) return;
        setTodayItems(todayItems.map(i => i.id === id ? { ...i, text: editText.trim() } : i));
        setEditId(null); setEditText("");
      };
      const clearCompleted = () => setTodayItems(todayItems.filter(i => !i.completed));

      const endDay = () => {
        if (total === 0) { setEndMsg("empty"); setTimeout(()=>setEndMsg(""),3000); return; }
        if (alreadyArchived) {
          // overwrite existing record for today
          const record = {
            date: todayStr,
            items: todayItems.map(i => ({ id:i.id, text:i.text, completed:i.completed })),
            completedCount: done,
            totalCount: total,
            completionRate: pct,
          };
          setDailyHistory([...dailyHistory.filter(h => h.date !== todayStr), record]);
          setEndMsg("updated");
        } else {
          const record = {
            date: todayStr,
            items: todayItems.map(i => ({ id:i.id, text:i.text, completed:i.completed })),
            completedCount: done,
            totalCount: total,
            completionRate: pct,
          };
          setDailyHistory([...dailyHistory, record]);
          setEndMsg("saved");
        }
        setTodayItems([]);
        setTimeout(() => setEndMsg(""), 4000);
      };

      const allDone = total > 0 && done === total;

      // pastel pink/lavender accent vars
      const accent      = "#ec4899";
      const accentSoft  = dark ? "#4a1942" : "#fdf2f8";
      const accentBorder= dark ? "#6d2460" : "#fbcfe8";
      const accentText  = dark ? "#f9a8d4" : "#be185d";
      const lavSoft     = dark ? "#2d1b4a" : "#faf5ff";
      const lavBorder   = dark ? "#5b21b6" : "#e9d5ff";
      const lavText     = dark ? "#c4b5fd" : "#7c3aed";

      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 24, maxWidth: 680, margin: "0 auto" }}>

          {/* Header */}
          <div>
            <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 12, flexWrap:"wrap" }}>
              <div style={{ display:"flex", alignItems:"center", gap:12 }}>
                <div style={{ width: 44, height: 44, borderRadius: 14, background: "linear-gradient(135deg, #f9a8d4, #c084fc)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 22, flexShrink: 0 }}>☀️</div>
                <div>
                  <h2 style={{ fontFamily: "'DM Serif Display', serif", fontSize: 28, fontWeight: 400, color: css.text, lineHeight: 1 }}>Today's Plan</h2>
                  <p style={{ fontSize: 13, color: css.textMuted, marginTop: 4 }}>
                    {allDone ? "🎉 Everything done — great work!" : "Focus on what matters today."}
                  </p>
                </div>
              </div>
              {/* End Today button */}
              <div style={{ display:"flex", flexDirection:"column", alignItems:"flex-end", gap:6 }}>
                <button
                  onClick={endDay}
                  style={{ padding:"10px 18px", borderRadius:12, background: alreadyArchived ? (dark?"#2d1b4a":"#ede9fe") : "linear-gradient(135deg,#818cf8,#6366f1)", color: alreadyArchived ? lavText : "#fff", fontWeight:600, fontSize:13, border: alreadyArchived?`1px solid ${lavBorder}`:"none", cursor:"pointer", display:"flex", alignItems:"center", gap:7, whiteSpace:"nowrap" }}
                >
                  🌙 {alreadyArchived ? "Re-archive Today" : "End Today"}
                </button>
                {alreadyArchived && <div style={{ fontSize:10, color:lavText }}>✦ Already archived today</div>}
              </div>
            </div>
            {/* Success/status messages */}
            {endMsg === "saved" && (
              <div style={{ marginTop:12, padding:"12px 16px", background: dark?"#1a2d1a":"#d1fae5", border:"1px solid #6ee7b7", borderRadius:12, fontSize:13, color:"#065f46", display:"flex", alignItems:"center", gap:8 }}>
                🌙 <strong>Today's memories have been saved.</strong> Your checklist has been archived and cleared for tomorrow.
              </div>
            )}
            {endMsg === "updated" && (
              <div style={{ marginTop:12, padding:"12px 16px", background: dark?"#1e1b38":"#ede9fe", border:`1px solid ${lavBorder}`, borderRadius:12, fontSize:13, color:lavText, display:"flex", alignItems:"center", gap:8 }}>
                💜 <strong>Archive updated.</strong> Today's log has been refreshed with your latest progress.
              </div>
            )}
            {endMsg === "empty" && (
              <div style={{ marginTop:12, padding:"12px 16px", background: dark?"#2d1b1b":"#fee2e2", border:"1px solid #fca5a5", borderRadius:12, fontSize:13, color:"#b91c1c", display:"flex", alignItems:"center", gap:8 }}>
                ☁️ <strong>Nothing to save.</strong> Add some items first before ending your day.
              </div>
            )}
          </div>

          {/* Stats row */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12 }}>
            {[
              { label: "Total", val: total, icon: "📋", grad: "linear-gradient(135deg, #a78bfa, #7c3aed)" },
              { label: "Completed", val: done, icon: "✅", grad: "linear-gradient(135deg, #34d399, #059669)" },
              { label: "Remaining", val: remaining, icon: "⏳", grad: "linear-gradient(135deg, #f9a8d4, #ec4899)" },
            ].map(s => (
              <div key={s.label} className="lf-card" style={{ textAlign: "center", padding: "16px 12px", position: "relative", overflow: "hidden" }}>
                <div style={{ position: "absolute", top: -12, right: -12, width: 60, height: 60, borderRadius: "50%", background: s.grad, opacity: 0.08 }} />
                <div style={{ fontSize: 22 }}>{s.icon}</div>
                <div style={{ fontSize: 26, fontWeight: 700, color: css.text, marginTop: 4 }}>{s.val}</div>
                <div style={{ fontSize: 11, color: css.textMuted, marginTop: 1 }}>{s.label}</div>
              </div>
            ))}
          </div>

          {/* Progress */}
          {total > 0 && (
            <div className="lf-card" style={{ padding: "16px 20px" }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 10 }}>
                <span style={{ fontSize: 14, fontWeight: 600, color: css.text }}>Daily progress</span>
                <span style={{ fontSize: 20, fontWeight: 700, background: "linear-gradient(90deg,#ec4899,#a855f7)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>{pct}%</span>
              </div>
              <div style={{ height: 10, borderRadius: 5, background: dark ? "#2d2d4a" : "#f3e8ff", overflow: "hidden" }}>
                <div style={{ height: "100%", borderRadius: 5, background: "linear-gradient(90deg, #ec4899, #a855f7)", width: `${pct}%`, transition: "width 0.5s ease" }} />
              </div>
              {allDone && (
                <div style={{ marginTop: 10, fontSize: 13, color: accentText, textAlign: "center", fontWeight: 500 }}>
                  🎊 All done! You crushed today's plan!
                </div>
              )}
            </div>
          )}

          {/* Add input */}
          <div style={{ background: accentSoft, border: `1px solid ${accentBorder}`, borderRadius: 16, padding: "16px 18px" }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: accentText, marginBottom: 10, letterSpacing: "0.05em", textTransform: "uppercase" }}>✦ Add to today</div>
            <div style={{ display: "flex", gap: 10 }}>
              <input
                className="lf-input"
                placeholder="e.g. Read Python for 30 minutes, Buy groceries…"
                value={input}
                onChange={e => setInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && addItem()}
                style={{ flex: 1, background: dark ? "#1a0a2e" : "#fff", borderColor: accentBorder }}
              />
              <button
                onClick={addItem}
                style={{ padding: "10px 20px", borderRadius: 10, background: "linear-gradient(135deg, #ec4899, #a855f7)", color: "#fff", fontWeight: 600, fontSize: 14, border: "none", cursor: "pointer", whiteSpace: "nowrap", flexShrink: 0 }}
              >
                + Add
              </button>
            </div>
            <div style={{ fontSize: 11, color: accentText, marginTop: 8, opacity: 0.7 }}>Press Enter to add quickly</div>
          </div>

          {/* Checklist */}
          <div className="lf-card" style={{ padding: 0, overflow: "hidden" }}>
            {/* incomplete items */}
            {sorted.filter(i => !i.completed).length > 0 && (
              <div>
                <div style={{ padding: "14px 20px 6px", fontSize: 11, fontWeight: 700, color: css.textMuted, letterSpacing: "0.06em", textTransform: "uppercase" }}>
                  ⏳ To do — {sorted.filter(i => !i.completed).length} remaining
                </div>
                {sorted.filter(i => !i.completed).map((item, idx, arr) => (
                  <TodayItem
                    key={item.id} item={item}
                    editId={editId} editText={editText}
                    setEditId={setEditId} setEditText={setEditText}
                    saveEdit={saveEdit} toggle={toggle} del={del}
                    isLast={idx === arr.length - 1} css={css} dark={dark}
                    accent={accent} accentSoft={accentSoft}
                  />
                ))}
              </div>
            )}

            {/* completed items */}
            {sorted.filter(i => i.completed).length > 0 && (
              <div>
                <div style={{ padding: "14px 20px 6px", fontSize: 11, fontWeight: 700, color: css.textMuted, letterSpacing: "0.06em", textTransform: "uppercase", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span>✅ Completed — {done}</span>
                  <button onClick={clearCompleted} style={{ fontSize: 11, color: "#ef4444", background: "transparent", border: "none", cursor: "pointer", fontWeight: 500 }}>Clear all</button>
                </div>
                {sorted.filter(i => i.completed).map((item, idx, arr) => (
                  <TodayItem
                    key={item.id} item={item}
                    editId={editId} editText={editText}
                    setEditId={setEditId} setEditText={setEditText}
                    saveEdit={saveEdit} toggle={toggle} del={del}
                    isLast={idx === arr.length - 1} css={css} dark={dark}
                    accent={accent} accentSoft={accentSoft}
                  />
                ))}
              </div>
            )}

            {total === 0 && (
              <div style={{ padding: "40px 20px", textAlign: "center" }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>🌸</div>
                <div style={{ fontFamily: "'DM Serif Display', serif", fontSize: 20, color: css.text, fontWeight: 400 }}>A fresh day awaits</div>
                <div style={{ fontSize: 13, color: css.textMuted, marginTop: 6 }}>Add your first item above to get started.</div>
              </div>
            )}
          </div>
        </div>
      );
    }

    function TodayItem({ item, editId, editText, setEditId, setEditText, saveEdit, toggle, del, isLast, css, dark, accent, accentSoft }) {
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "12px 20px", borderBottom: isLast ? "none" : `1px solid ${css.border}`, transition: "background 0.15s" }}>
          {/* Circle checkbox */}
          <button
            onClick={() => toggle(item.id)}
            style={{
              width: 24, height: 24, borderRadius: "50%", flexShrink: 0,
              border: `2px solid ${item.completed ? accent : css.border}`,
              background: item.completed ? accent : "transparent",
              display: "flex", alignItems: "center", justifyContent: "center",
              cursor: "pointer", transition: "all 0.18s"
            }}
          >
            {item.completed && <span style={{ color: "#fff", fontSize: 12, lineHeight: 1 }}>✓</span>}
          </button>

          {/* Text or edit input */}
          {editId === item.id ? (
            <input
              className="lf-input"
              autoFocus
              value={editText}
              onChange={e => setEditText(e.target.value)}
              onKeyDown={e => { if (e.key === "Enter") saveEdit(item.id); if (e.key === "Escape") { setEditId(null); setEditText(""); } }}
              style={{ flex: 1, padding: "6px 10px", fontSize: 14 }}
            />
          ) : (
            <span
              style={{ flex: 1, fontSize: 14, color: css.text, textDecoration: item.completed ? "line-through" : "none", opacity: item.completed ? 0.45 : 1, cursor: "text", lineHeight: 1.5 }}
              onDoubleClick={() => { setEditId(item.id); setEditText(item.text); }}
            >
              {item.text}
            </span>
          )}

          {/* Actions */}
          <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
            {editId === item.id ? (
              <>
                <button onClick={() => saveEdit(item.id)} style={{ fontSize: 12, padding: "3px 10px", borderRadius: 8, background: accent, color: "#fff", border: "none", cursor: "pointer", fontWeight: 500 }}>Save</button>
                <button onClick={() => { setEditId(null); setEditText(""); }} style={{ fontSize: 12, padding: "3px 8px", borderRadius: 8, background: css.hover, color: css.textMuted, border: "none", cursor: "pointer" }}>✕</button>
              </>
            ) : (
              <>
                <button
                  onClick={() => { setEditId(item.id); setEditText(item.text); }}
                  style={{ fontSize: 13, padding: "3px 8px", borderRadius: 8, background: "transparent", color: css.textMuted, border: "none", cursor: "pointer", opacity: 0.6 }}
                  title="Edit"
                >✏️</button>
                <button
                  onClick={() => del(item.id)}
                  style={{ fontSize: 13, padding: "3px 8px", borderRadius: 8, background: "transparent", color: "#ef4444", border: "none", cursor: "pointer", opacity: 0.7 }}
                  title="Delete"
                >✕</button>
              </>
            )}
          </div>
        </div>
      );
    }

    function LifeFlow() {
      const [dark, setDark] = useLS("lf_dark", false);
      const [tab, setTab] = useState("dashboard");
      const [tasks, setTasks] = useLS("lf_tasks", seedTasks);
      const [habits, setHabits] = useLS("lf_habits", seedHabits);
      const [events, setEvents] = useLS("lf_events", seedEvents);
      const [moods, setMoods] = useLS("lf_moods", []);
      const [journals, setJournals] = useLS("lf_journals", []);
      const [todayItems, setTodayItems] = useLS("lf_today_items", []);
      const [todoItems, setTodoItems] = useLS("lf_todo_items", []);
      const [projects, setProjects] = useLS("lf_projects", []);
      const [wantItems, setWantItems] = useLS("lf_want_items", []);
      const [dailyHistory, setDailyHistory] = useLS("lf_daily_history", []);

      const quote = QUOTES[new Date().getDay() % QUOTES.length];
      const css = dark ? darkCSS : lightCSS;

      const dynCSS = `
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display:ital@0;1&display=swap');

        .nav-item { padding: 10px 16px; border-radius: 10px; cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; transition: all 0.18s; white-space: nowrap; }
        .nav-item.active { background: #db2777; color: #fff; }

        .tag { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 16px; }

        .cal-day:hover { background: ${css.hover}; }
        .cal-day.today { background: #8b5cf6; color: #fff; font-weight: 600; }
        .progress-bar { height: 6px; border-radius: 3px; background: ${dark ? "#333" : "#f1f5f9"}; overflow: hidden; }
        .progress-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
        .streak-badge { background: linear-gradient(135deg, #f59e0b, #ef4444); color: #fff; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; }
        @media (max-width: 768px) { .sidebar { display: none !important; } .top-nav { display: flex !important; } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease forwards; }
      `;

      return (
        <div style={{ ...css.app, fontFamily: "'DM Sans', 'Segoe UI', sans-serif", minHeight: "100vh" }}>
          <style dangerouslySetInnerHTML={{ __html: dynCSS }} />
          <div style={{ display: "flex", minHeight: "100vh" }}>
            <aside className="sidebar" style={{ width: 220, background: css.sidebar, borderRight: `1px solid ${css.border}`, padding: "24px 12px", display: "flex", flexDirection: "column", gap: 4, flexShrink: 0, position: "sticky", top: 0, height: "100vh", overflowY: "auto" }}>
              <div style={{ padding: "0 8px 24px" }}>
                <div style={{ fontFamily: "'DM Serif Display', serif", fontSize: 22, color: "#db2777" }}>LifeFlow</div>
                <div style={{ fontSize: 11, color: css.textMuted, marginTop: 2 }}>Your personal OS</div>
              </div>
              {[["dashboard","🏠","Dashboard"],["today","☀️","Today"],["calendar","📅","Calendar"],["tasks","✅","Tasks"],["todo","📝","To Do List"],["wantodo","🌟","Want To Do"],["habits","🔥","Habits"],["mood","💫","Mood"],["journal","📝","Journal"]].map(([id, icon, label]) => (
                <div key={id} className={`nav-item${tab === id ? " active" : ""}`} style={{ color: tab === id ? "#fff" : css.textMuted }} onClick={() => setTab(id)}>
                  <span>{icon}</span><span>{label}</span>
                </div>
              ))}
              <div style={{ flex: 1 }} />
              <div className="nav-item" style={{ color: css.textMuted }} onClick={() => setDark(!dark)}>
                <span>{dark ? "☀️" : "🌙"}</span><span>{dark ? "Light mode" : "Dark mode"}</span>
              </div>
            </aside>

            <main style={{ flex: 1, padding: "24px 28px", overflowY: "auto", background: css.bg, minHeight: "100vh" }}>
              <div className="top-nav" style={{ display: "none", gap: 8, marginBottom: 20, overflowX: "auto", paddingBottom: 4 }}>
                {[["dashboard","🏠"],["today","☀️"],["calendar","📅"],["tasks","✅"],["todo","📝"],["wantodo","🌟"],["habits","🔥"],["mood","💫"],["journal","📖"]].map(([id,icon]) => (
                  <button key={id} className={`lf-btn${tab===id?" lf-btn-primary":" lf-btn-ghost"}`} style={{ padding: "8px 14px", borderRadius: 20, fontSize: 20 }} onClick={() => setTab(id)}>{icon}</button>
                ))}
                <button className="lf-btn lf-btn-ghost" style={{ marginLeft: "auto", borderRadius: 20 }} onClick={() => setDark(!dark)}>{dark ? "☀️" : "🌙"}</button>
              </div>

              <div className="fade-in" key={tab}>
                {tab === "dashboard" && <Dashboard tasks={tasks} habits={habits} events={events} moods={moods} journals={journals} todayItems={todayItems} todoItems={todoItems} wantItems={wantItems} dailyHistory={dailyHistory} quote={quote} css={css} dark={dark} setTab={setTab} />}
                {tab === "today"     && <TodayPage todayItems={todayItems} setTodayItems={setTodayItems} dailyHistory={dailyHistory} setDailyHistory={setDailyHistory} css={css} dark={dark} />}
                {tab === "calendar"  && <Calendar events={events} setEvents={setEvents} dailyHistory={dailyHistory} css={css} dark={dark} />}
                {tab === "tasks"     && <Tasks tasks={tasks} setTasks={setTasks} css={css} dark={dark} />}
                {tab === "todo"      && <TodoListPage todoItems={todoItems} setTodoItems={setTodoItems} projects={projects} setProjects={setProjects} css={css} dark={dark} />}
                {tab === "wantodo"   && <WantToDoPage wantItems={wantItems} setWantItems={setWantItems} css={css} dark={dark} />}
                {tab === "habits"    && <Habits habits={habits} setHabits={setHabits} css={css} dark={dark} />}
                {tab === "mood"      && <MoodTracker moods={moods} setMoods={setMoods} css={css} dark={dark} />}
                {tab === "journal"   && <Journal journals={journals} setJournals={setJournals} css={css} dark={dark} />}
              </div>
            </main>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<LifeFlow />);
  </script>
</body>
</html>
